# Registry of every CloudFormation template in this repository.
#
# Stack names follow <application>-<environment>-<name>, e.g. aidlc-main-hello-world. That
# convention is not cosmetic: BuildPipelineRole in pipeline/pipeline.yml scopes its
# CloudFormation permissions to arn:...:stack/${Application}-${Environment}*, so a stack
# named outside the convention cannot be deployed by the pipeline.
#
# deployed_by:
#   pipeline  deployed by pipeline/pipeline.yml on merge to the tracked branch
#   manual    chicken-and-egg bootstrap, run by hand once per account
#
# pipeline/validate_stacks.py enforces two invariants, each in both directions: this file
# against the filesystem, and this file against the CloudFormation actions in pipeline.yml.
# PR checks cfn-lint everything listed here, so registering a new template is what makes it
# linted -- add the entry in the same PR as the template.
#
# A 'pipeline' entry with no action in pipeline.yml is an error, because it would deploy
# nothing while every check and every pipeline stage still reported success.

templates:

  - name: 'account-bootstrap'
    template: 'bootstrap/account-bootstrap.yml'
    deployed_by: 'manual'
    description: 'Deploy role, artifact bucket and GitHub connection. Must exist before the pipeline can deploy anything.'

  - name: 'pipeline'
    template: 'pipeline/pipeline.yml'
    deployed_by: 'pipeline'
    description: 'The deploy path itself. Deployed by hand once, then self-updates in the PipelineDeploy stage.'

  - name: 'hello-world'
    template: 'blueprints/hello-world/infra/hello-world.yml'
    deployed_by: 'pipeline'
    description: 'Trivial tagged stack that proves the deploy path end to end.'

  - name: 'notify-topic'
    template: 'blueprints/notify-topic/infra/notify-topic.yml'
    deployed_by: 'pipeline'
    description: 'SNS topic with an optional email subscription -- a notification channel other blueprints or people can publish to.'

  - name: 'tiny-chatbot'
    template: 'blueprints/tiny-chatbot/infra/tiny-chatbot.yml'
    deployed_by: 'manual'
    description: 'Experimental canned-response chatbot behind a public Lambda Function URL. Parked until the hello-world deploy path is verified end to end; flipped to pipeline in the PR that wires its Build stage action (blueprints/tiny-chatbot/Dockerfile, target tiny-chatbot).'

  - name: 'aisei-site'
    template: 'blueprints/aisei-site/infra/aisei-site.yml'
    deployed_by: 'manual'
    description: 'Standalone Angular + Hono web app, run via the AWS Lambda Web Adapter behind a public Function URL. Parked until the hello-world deploy path is verified end to end; flipped to pipeline in the PR that wires its Build stage action (blueprints/aisei-site/Dockerfile, target aisei-site).'

  - name: 'builder-mcp'
    template: 'packages/builder-mcp/infra/builder-mcp.yml'
    deployed_by: 'pipeline'
    description: 'Cornell Builder MCP server on Bedrock AgentCore. Image built by the Build stage (arm64, root Dockerfile target builder-mcp), deployed by digest.'

  - name: 'knowledgebase'
    template: 'blueprints/knowledgebase/infra/knowledgebase.yml'
    deployed_by: 'pipeline'
    description: 'Bedrock managed knowledge base over the existing document bucket. Verifies at deploy time that the documents are indexed and answerable, so a green deploy is the acceptance test.'
  - name: 'dashboard-storage'
    template: 'blueprints/dashboard/infra/dashboard-storage.yml'
    deployed_by: 'pipeline'
    description: 'Cost & usage dashboard STATEFUL stack: the snapshot store and site buckets. Separate from the app stack so an application update cannot replace the data. Deploys at RunOrder 1, before the app stack and the site sync.'

  - name: 'dashboard'
    template: 'blueprints/dashboard/infra/dashboard.yml'
    deployed_by: 'pipeline'
    description: 'Cost & usage dashboard APPLICATION stack: two arm64 Lambdas (collector + read API, HasImage-gated), HTTP API, CloudFront edge, WAF allowlist, schedule, alarms. Images built by the Build stage; deployed by digest at RunOrder 2.'

  - name: 'dashboard-marker'
    template: 'blueprints/dashboard/infra/dashboard-marker.yml'
    deployed_by: 'pipeline'
    description: 'Deployment marker for the cost & usage dashboard blueprint. Flipped manual -> pipeline (DR-02) in the same PR as its BlueprintDeploy action, now that U-02 wires the dashboard deploy: HasImage on the app stack makes a real deployable action possible before images exist, so the marker no longer deploys nothing.'
