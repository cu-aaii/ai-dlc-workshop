AWSTemplateFormatVersion: '2010-09-09'
Description: 'AI-DLC workshop deploy path: GitHub -> CodePipeline -> CodeBuild -> CloudFormation. Adapted from the AI Innovation Lab reference pipeline; mechanics preserved, shape generalized to a blueprint monorepo.'

Parameters:

  # Metadata Parameters

  Application:
    Default: 'aidlc'
    AllowedPattern: '[a-z0-9-]{1,10}'
    Description: 'Name used for billing and other tracking/identification purposes'
    Type: 'String'

  Environment:
    Default: 'main'
    AllowedPattern: '[a-z0-9]{1,4}'
    Description: 'Name of the deployment branch. The Source stage tracks the branch of this name, so Environment=main means "merges to main deploy".'
    Type: 'String'

  Owner:
    Default: 'ai-sei'
    AllowedPattern: '.{1,128}'
    Description: 'Value for the required cornell:owner tag'
    Type: 'String'

  RemoteGitRepository:
    Default: 'cu-aaii/ai-dlc-workshop'
    Description: 'The Organization/Name of the remote git repository'
    Type: 'String'

  SsmCodeStarConnectionArn:
    Default: '/code-connections/cu-aaii'
    Description: 'The name of the SSM Parameter containing the ARN for the CodeStar Connection with permission to clone the remote git repository'
    Type: 'AWS::SSM::Parameter::Value<String>'

Resources:

  # Container build (x86). Wiring a blueprint image = a Build action + a Dockerfile target; see
  # pipeline/README.md. The arm64 sibling below is what Lambda/AgentCore images actually use.

  ContainerBuildRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Application}-${Environment}-container-build'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - !Sub 'codebuild.${AWS::URLSuffix}'
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: 'container-build'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'codestar-connections:UseConnection'
                Resource:
                  - !Ref 'SsmCodeStarConnectionArn'
              - Effect: 'Allow'
                Action:
                  - 'ecr:BatchGetImage'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:CompleteLayerUpload'
                  - 'ecr:DescribeImages'
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:InitiateLayerUpload'
                  - 'ecr:PutImage'
                  - 'ecr:UploadLayerPart'
                Resource:
                  - '*'
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${Application}-${Environment}-container*'
              - Effect: 'Allow'
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::deployment-artifacts-${AWS::AccountId}-*/*'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'iam-role-build-project-container-build'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  ContainerRepository:
    Type: 'AWS::ECR::Repository'
    Properties:
      RepositoryName: !Sub '${Application}-${Environment}'
      ImageTagMutability: 'MUTABLE'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |-
          {
            "rules": [
              {
                "action": {
                  "type": "expire"
                },
                "selection": {
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1,
                  "tagStatus": "untagged"
                },
                "description": "Expire Untagged Images",
                "rulePriority": 1
              },
              {
                "action": {
                  "type": "expire"
                },
                "selection": {
                  "countType": "imageCountMoreThan",
                  "countNumber": 3,
                  "tagPrefixList": ["commit-"],
                  "tagStatus": "tagged"
                },
                "description": "Expire >3 Commit Tags",
                "rulePriority": 2
              }
            ]
          }
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              AWS:
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - 'ecr:GetDownloadUrlForLayer'
              - 'ecr:BatchGetImage'
              - 'ecr:BatchCheckLayerAvailability'
          - Effect: 'Allow'
            Principal:
              AWS: !GetAtt 'ContainerBuildRole.Arn'
            Action:
              - 'ecr:BatchGetImage'
              - 'ecr:BatchCheckLayerAvailability'
              - 'ecr:CompleteLayerUpload'
              - 'ecr:DescribeImages'
              - 'ecr:GetDownloadUrlForLayer'
              - 'ecr:InitiateLayerUpload'
              - 'ecr:PutImage'
              - 'ecr:UploadLayerPart'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'ecr-repository'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  ContainerBuildLogs:
    Type: 'AWS::Logs::LogGroup'
    DeletionPolicy: 'Delete'
    UpdateReplacePolicy: 'Delete'
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${Application}-${Environment}-container'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'log-group-build-project-container'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  ContainerBuildProject:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Name: !Sub '${Application}-${Environment}-container'
      Description: !Sub 'Builds container images for the ${Application}-${Environment} pipeline'
      ServiceRole: !GetAtt 'ContainerBuildRole.Arn'
      TimeoutInMinutes: 60
      Visibility: 'PRIVATE'
      Artifacts:
        Type: 'CODEPIPELINE'
      Cache:
        Type: 'NO_CACHE'
      Environment:
        ComputeType: 'BUILD_GENERAL1_SMALL'
        Image: 'aws/codebuild/amazonlinux2-x86_64-standard:4.0'
        ImagePullCredentialsType: 'CODEBUILD'
        PrivilegedMode: true
        Type: 'LINUX_CONTAINER'
        EnvironmentVariables:
          - Name: 'APPLICATION'
            Value: !Ref 'Application'
          - Name: 'ENVIRONMENT'
            Value: !Ref 'Environment'
          - Name: 'CONTAINER_REPOSITORY_URI'
            Value: !Sub '${ContainerRepository.RepositoryUri}'
          - Name: 'DOCKER_CLI_EXPERIMENTAL'
            Value: 'enabled'
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref 'ContainerBuildLogs'
          Status: 'ENABLED'
      Source:
        BuildSpec: 'pipeline/codebuild.yml'
        GitCloneDepth: 0
        Type: 'CODEPIPELINE'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'codebuild-project-container'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  # ARM container build -- same mechanics as ContainerBuildProject, aarch64 compute. Lambda
  # (arm64) and AgentCore runtimes need linux/arm64, which the x86 project cannot produce.

  ArmContainerBuildLogs:
    Type: 'AWS::Logs::LogGroup'
    DeletionPolicy: 'Delete'
    UpdateReplacePolicy: 'Delete'
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${Application}-${Environment}-container-arm'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'log-group-build-project-container-arm'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  ArmContainerBuildProject:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Name: !Sub '${Application}-${Environment}-container-arm'
      Description: !Sub 'Builds linux/arm64 container images for the ${Application}-${Environment} pipeline (AgentCore runtimes)'
      ServiceRole: !GetAtt 'ContainerBuildRole.Arn'
      TimeoutInMinutes: 60
      Visibility: 'PRIVATE'
      Artifacts:
        Type: 'CODEPIPELINE'
      Cache:
        Type: 'NO_CACHE'
      Environment:
        ComputeType: 'BUILD_GENERAL1_SMALL'
        Image: 'aws/codebuild/amazonlinux2-aarch64-standard:3.0'
        ImagePullCredentialsType: 'CODEBUILD'
        PrivilegedMode: true
        Type: 'ARM_CONTAINER'
        EnvironmentVariables:
          - Name: 'APPLICATION'
            Value: !Ref 'Application'
          - Name: 'ENVIRONMENT'
            Value: !Ref 'Environment'
          - Name: 'CONTAINER_REPOSITORY_URI'
            Value: !Sub '${ContainerRepository.RepositoryUri}'
          - Name: 'DOCKER_CLI_EXPERIMENTAL'
            Value: 'enabled'
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref 'ArmContainerBuildLogs'
          Status: 'ENABLED'
      Source:
        BuildSpec: 'pipeline/codebuild.yml'
        GitCloneDepth: 0
        Type: 'CODEPIPELINE'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'codebuild-project-container-arm'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  # Static-site builder (U-02 dashboard C-06): builds the Vite bundle, syncs to the site bucket
  # WITHOUT --delete. Detail in blueprints/dashboard aidlc-docs deployment-architecture.md.
  SiteBuildLogs:
    Type: 'AWS::Logs::LogGroup'
    DeletionPolicy: 'Delete'
    UpdateReplacePolicy: 'Delete'
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${Application}-${Environment}-site'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'log-group-build-project-site'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  SiteBuildRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Application}-${Environment}-site-build'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - !Sub 'codebuild.${AWS::URLSuffix}'
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: 'site-build'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${Application}-${Environment}-site*'
              - Effect: 'Allow'
                Action:
                  - 's3:GetObject'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::deployment-artifacts-${AWS::AccountId}-*/*'
              - Effect: 'Allow'
                # Write to any dashboard site bucket in this account; no DeleteObject (no --delete).
                Action:
                  - 's3:PutObject'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${Application}-${Environment}-*-site-${AWS::AccountId}/*'
              - Effect: 'Allow'
                Action:
                  - 's3:ListBucket'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${Application}-${Environment}-*-site-${AWS::AccountId}'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'iam-role-build-project-site-build'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  SiteBuildProject:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Name: !Sub '${Application}-${Environment}-site'
      Description: !Sub 'Builds and syncs the dashboard static site for the ${Application}-${Environment} pipeline'
      ServiceRole: !GetAtt 'SiteBuildRole.Arn'
      TimeoutInMinutes: 20
      Visibility: 'PRIVATE'
      Artifacts:
        Type: 'CODEPIPELINE'
      Cache:
        Type: 'NO_CACHE'
      Environment:
        ComputeType: 'BUILD_GENERAL1_SMALL'
        Image: 'aws/codebuild/amazonlinux2-x86_64-standard:5.0'
        ImagePullCredentialsType: 'CODEBUILD'
        Type: 'LINUX_CONTAINER'
        EnvironmentVariables:
          - Name: 'APPLICATION'
            Value: !Ref 'Application'
          - Name: 'ENVIRONMENT'
            Value: !Ref 'Environment'
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref 'SiteBuildLogs'
          Status: 'ENABLED'
      Source:
        Type: 'CODEPIPELINE'
        GitCloneDepth: 0
        # Build the Vite bundle, sync to the site bucket WITHOUT --delete.
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 20
              commands:
                - cd blueprints/dashboard/ui
                - npm ci
            build:
              commands:
                - npm run build
                - aws s3 sync dist/ "s3://${SITE_BUCKET}/" --no-progress
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'codebuild-project-site'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  # Terraform Runner: Azure/Entra only, executed from one CodeBuild project (the action supplies
  # TF_WORKING_DIR + TF_STATE_KEY). Adding a module = a Terraform action + a .tf dir; see README.

  # Azure/Entra credentials, injected out of band (never in this public repo). Uses
  # GenerateSecretString, NOT SecretString -- load-bearing: PipelineDeploy redeploys this stack
  # every merge, and a SecretString placeholder would reset the credential each time (editing the
  # GenerateSecretString block below also clobbers it). The placeholder carries all three keys so
  # an uninjected secret fails as an Azure auth error, not an opaque CodeBuild error. See CLAUDE.md.

  AzureCredentialsSecret:
    Type: 'AWS::SecretsManager::Secret'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      Name: !Sub '${Application}/${Environment}/azure/terraform-credentials'
      Description: 'Azure/Entra service principal the Terraform stage authenticates as. Value injected out of band; never stored in the repository.'
      GenerateSecretString:
        SecretStringTemplate: '{"tenant_id":"replace-me","client_id":"replace-me"}'
        GenerateStringKey: 'client_secret'
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'secretsmanager-secret-azure-terraform-credentials'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  # Terraform state: its own bucket, no lifecycle (the artifact bucket's 30-day expiry would
  # orphan state), versioned, and Retain-on-delete (losing it loses the record of tenant state).
  TerraformStateBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      BucketName: !Sub '${Application}-${Environment}-tfstate-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'AES256'
      OwnershipControls:
        Rules:
          - ObjectOwnership: 'BucketOwnerEnforced'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: 'Enabled'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 's3-bucket-terraform-state'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  TerraformBuildRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Application}-${Environment}-terraform'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - !Sub 'codebuild.${AWS::URLSuffix}'
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: 'terraform'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Exactly one secret, by exact ARN (!Ref returns the full ARN incl. the random
              # suffix), so this cannot widen to another secret by accident.
              - Effect: 'Allow'
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource:
                  - !Ref 'AzureCredentialsSecret'
              # DeleteObject is what releases the S3 native state lock, so read-only here
              # would hang every subsequent run on a stale lock.
              - Effect: 'Allow'
                Action:
                  - 's3:DeleteObject'
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource:
                  - !Sub '${TerraformStateBucket.Arn}/*'
              - Effect: 'Allow'
                Action:
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt 'TerraformStateBucket.Arn'
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${Application}-${Environment}-terraform*'
              # The CodePipeline input artifact.
              - Effect: 'Allow'
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::deployment-artifacts-${AWS::AccountId}-*/*'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'iam-role-build-project-terraform'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  TerraformLogs:
    Type: 'AWS::Logs::LogGroup'
    DeletionPolicy: 'Delete'
    UpdateReplacePolicy: 'Delete'
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${Application}-${Environment}-terraform'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'log-group-build-project-terraform'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  TerraformProject:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      # The ${Application}-${Environment} prefix is required, not decorative:
      # BuildPipelineRole scopes codebuild:StartBuild to project/${Application}-${Environment}*
      # so a project named outside it cannot be started by the pipeline.
      Name: !Sub '${Application}-${Environment}-terraform'
      Description: !Sub 'Runs Terraform against non-AWS (Azure/Entra) resources for the ${Application}-${Environment} pipeline'
      ServiceRole: !GetAtt 'TerraformBuildRole.Arn'
      TimeoutInMinutes: 30
      Visibility: 'PRIVATE'
      Artifacts:
        Type: 'CODEPIPELINE'
      Cache:
        Type: 'NO_CACHE'
      Environment:
        ComputeType: 'BUILD_GENERAL1_SMALL'
        Image: 'aws/codebuild/amazonlinux2-x86_64-standard:4.0'
        ImagePullCredentialsType: 'CODEBUILD'
        # Unlike the container build, Terraform needs no Docker daemon.
        PrivilegedMode: false
        Type: 'LINUX_CONTAINER'
        EnvironmentVariables:
          - Name: 'APPLICATION'
            Value: !Ref 'Application'
          - Name: 'ENVIRONMENT'
            Value: !Ref 'Environment'
          - Name: 'OWNER'
            Value: !Ref 'Owner'
          - Name: 'TF_STATE_BUCKET'
            Value: !Ref 'TerraformStateBucket'
          - Name: 'TF_VERSION'
            Value: '1.15.8'
          # The azuread and azurerm providers both read these natively, so the credential
          # never lands in a .tfvars file, a variable, or Terraform state. CodeBuild resolves
          # each json-key at build start; the service role above is what permits it.
          - Name: 'ARM_TENANT_ID'
            Type: 'SECRETS_MANAGER'
            Value: !Sub '${AzureCredentialsSecret}:tenant_id'
          - Name: 'ARM_CLIENT_ID'
            Type: 'SECRETS_MANAGER'
            Value: !Sub '${AzureCredentialsSecret}:client_id'
          - Name: 'ARM_CLIENT_SECRET'
            Type: 'SECRETS_MANAGER'
            Value: !Sub '${AzureCredentialsSecret}:client_secret'
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref 'TerraformLogs'
          Status: 'ENABLED'
      Source:
        BuildSpec: 'pipeline/terraform.yml'
        GitCloneDepth: 0
        Type: 'CODEPIPELINE'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'codebuild-project-terraform'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  # Deploy Pipeline

  BuildPipelineRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Application}-${Environment}-${AWS::Region}-codepipeline'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - !Sub 'codepipeline.${AWS::URLSuffix}'
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: 'codepipeline'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'cloudformation:CreateStack'
                  - 'cloudformation:DeleteStack'
                  - 'cloudformation:DescribeStacks'
                  - 'cloudformation:UpdateStack'
                  - 'cloudformation:CreateChangeSet'
                  - 'cloudformation:DeleteChangeSet'
                  - 'cloudformation:DescribeChangeSet'
                  - 'cloudformation:ExecuteChangeSet'
                  - 'cloudformation:SetStackPolicy'
                  - 'cloudformation:ValidateTemplate'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${Application}-${Environment}*'
              - Effect: 'Allow'
                Action:
                  - 'codebuild:BatchGetBuildBatches'
                  - 'codebuild:BatchGetBuilds'
                  - 'codebuild:StartBuild'
                  - 'codebuild:StartBuildBatch'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:codebuild:*:${AWS::AccountId}:project/${Application}-${Environment}*'
              - Effect: 'Allow'
                Action:
                  - 'codestar-connections:UseConnection'
                Resource:
                  - !Ref 'SsmCodeStarConnectionArn'
              - Effect: 'Allow'
                Action:
                  - 'iam:PassRole'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
              - Effect: 'Allow'
                Action:
                  - 's3:GetObject*'
                  - 's3:GetReplicationConfiguration'
                  - 's3:ListBucket'
                  - 's3:PutObject*'
                  - 's3:Replicate*'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::deployment-artifacts-${AWS::AccountId}-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::deployment-artifacts-${AWS::AccountId}-*/*'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'iam-role-build-pipeline'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'

  BuildPipeline:
    Type: 'AWS::CodePipeline::Pipeline'
    Properties:
      Name: !Sub '${Application}-${Environment}'
      RestartExecutionOnUpdate: true
      RoleArn: !GetAtt 'BuildPipelineRole.Arn'
      ArtifactStores:
        - Region: !Ref 'AWS::Region'
          ArtifactStore:
            Location: !Sub 'deployment-artifacts-${AWS::AccountId}-${AWS::Region}'
            Type: 'S3'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'pipeline-build'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
      Stages:

        # Tracks the branch named by Environment; DetectChanges registers a webhook. Branch
        # protection is what makes "a merge" mean "an approved PR".
        - Name: 'Source'
          Actions:
            - Name: 'GitRepository'
              Namespace: 'GitRepository'
              OutputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Source'
                Owner: 'AWS'
                Provider: 'CodeStarSourceConnection'
                Version: '1'
              Configuration:
                ConnectionArn: !Ref 'SsmCodeStarConnectionArn'
                BranchName: !Ref 'Environment'
                FullRepositoryId: !Ref 'RemoteGitRepository'
                OutputArtifactFormat: 'CODE_ZIP'
                DetectChanges: 'true'

        # The pipeline deploys itself first, so a PR editing pipeline.yml takes effect on merge;
        # RestartExecutionOnUpdate then reruns from the top under the new definition.
        - Name: 'PipelineDeploy'
          Actions:
            - Name: 'PipelineCloudFormation'
              Namespace: 'PipelineCloudFormation'
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Deploy'
                Owner: 'AWS'
                Provider: 'CloudFormation'
                Version: '1'
              Configuration:
                ActionMode: 'CREATE_UPDATE'
                Capabilities: 'CAPABILITY_NAMED_IAM'
                RoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
                StackName: !Sub '${Application}-${Environment}-pipeline'
                TemplatePath: 'GitRepositoryArtifact::pipeline/pipeline.yml'
                ParameterOverrides: !Sub >-
                  {
                  "Application": "${Application}",
                  "Environment": "${Environment}",
                  "Owner": "${Owner}",
                  "RemoteGitRepository": "${RemoteGitRepository}"
                  }

        # Container images, built before anything deploys. One action per Dockerfile target
        # (CONTAINER_CONTEXT + CONTAINER_TARGET); CONTAINER_DIGEST is exported so the deploy
        # action pins by digest (see pipeline/codebuild.yml).
        - Name: 'Build'
          Actions:
            - Name: 'BuilderMcpContainer'
              Namespace: 'BuilderMcpContainer'
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Build'
                Owner: 'AWS'
                Provider: 'CodeBuild'
                Version: '1'
              Configuration:
                ProjectName: !Ref 'ArmContainerBuildProject'
                EnvironmentVariables: >-
                  [
                  {"name": "CONTAINER_TARGET", "value": "builder-mcp", "type": "PLAINTEXT"},
                  {"name": "CONTAINER_CONTEXT", "value": "packages/builder-mcp", "type": "PLAINTEXT"},
                  {"name": "DATE_TAG", "value": "#{GitRepository.AuthorDate}", "type": "PLAINTEXT"}
                  ]

            # Dashboard (U-02): two arm64 images from one Dockerfile (targets collector, api).
            - Name: 'DashboardCollectorContainer'
              Namespace: 'DashboardCollectorContainer'
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Build'
                Owner: 'AWS'
                Provider: 'CodeBuild'
                Version: '1'
              Configuration:
                ProjectName: !Ref 'ArmContainerBuildProject'
                EnvironmentVariables: >-
                  [
                  {"name": "CONTAINER_TARGET", "value": "collector", "type": "PLAINTEXT"},
                  {"name": "CONTAINER_CONTEXT", "value": "blueprints/dashboard", "type": "PLAINTEXT"},
                  {"name": "DATE_TAG", "value": "#{GitRepository.AuthorDate}", "type": "PLAINTEXT"}
                  ]

            - Name: 'DashboardApiContainer'
              Namespace: 'DashboardApiContainer'
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Build'
                Owner: 'AWS'
                Provider: 'CodeBuild'
                Version: '1'
              Configuration:
                ProjectName: !Ref 'ArmContainerBuildProject'
                EnvironmentVariables: >-
                  [
                  {"name": "CONTAINER_TARGET", "value": "api", "type": "PLAINTEXT"},
                  {"name": "CONTAINER_CONTEXT", "value": "blueprints/dashboard", "type": "PLAINTEXT"},
                  {"name": "DATE_TAG", "value": "#{GitRepository.AuthorDate}", "type": "PLAINTEXT"}
                  ]

            - Name: 'AiseiSiteContainer'
              Namespace: 'AiseiSiteContainer'
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Build'
                Owner: 'AWS'
                Provider: 'CodeBuild'
                Version: '1'
              Configuration:
                ProjectName: !Ref 'ArmContainerBuildProject'
                EnvironmentVariables: >-
                  [
                  {"name": "CONTAINER_TARGET", "value": "aisei-site", "type": "PLAINTEXT"},
                  {"name": "CONTAINER_CONTEXT", "value": "blueprints/aisei-site", "type": "PLAINTEXT"},
                  {"name": "DATE_TAG", "value": "#{GitRepository.AuthorDate}", "type": "PLAINTEXT"}
                  ]

            # The Teams front door's Lambda image. ARM because the function declares
            # Architectures: ['arm64'] -- the project and the function have to agree, and a
            # mismatch fails at cold start rather than at build time.
            - Name: 'TeamsBotContainer'
              Namespace: 'TeamsBotContainer'
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Build'
                Owner: 'AWS'
                Provider: 'CodeBuild'
                Version: '1'
              Configuration:
                ProjectName: !Ref 'ArmContainerBuildProject'
                EnvironmentVariables: >-
                  [
                  {"name": "CONTAINER_TARGET", "value": "teams-bot", "type": "PLAINTEXT"},
                  {"name": "CONTAINER_CONTEXT", "value": "blueprints/teams-bot", "type": "PLAINTEXT"},
                  {"name": "DATE_TAG", "value": "#{GitRepository.AuthorDate}", "type": "PLAINTEXT"}
                  ]

        # One action per blueprint stack; register the template in pipeline/stacks.yml too. Stack
        # names are <application>-<environment>-<name> (inside BuildPipelineRole's CFN scope).
        - Name: 'BlueprintDeploy'
          Actions:
            - Name: 'HelloWorldCloudFormation'
              Namespace: 'HelloWorldCloudFormation'
              RunOrder: 1
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Deploy'
                Owner: 'AWS'
                Provider: 'CloudFormation'
                Version: '1'
              Configuration:
                ActionMode: 'CREATE_UPDATE'
                Capabilities: 'CAPABILITY_NAMED_IAM'
                RoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
                StackName: !Sub '${Application}-${Environment}-hello-world'
                TemplatePath: 'GitRepositoryArtifact::blueprints/hello-world/infra/hello-world.yml'
                # Every parameter the blueprint needs is passed explicitly rather than left
                # to template defaults, so a stack deploys the same way by hand or by pipeline.
                ParameterOverrides: !Sub >-
                  {
                  "Application": "${Application}",
                  "Environment": "${Environment}",
                  "Owner": "${Owner}",
                  "SourceCommitId": "#{GitRepository.CommitId}"
                  }

            - Name: 'AiseiSiteCloudFormation'
              Namespace: 'AiseiSiteCloudFormation'
              RunOrder: 1
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Deploy'
                Owner: 'AWS'
                Provider: 'CloudFormation'
                Version: '1'
              Configuration:
                ActionMode: 'CREATE_UPDATE'
                Capabilities: 'CAPABILITY_NAMED_IAM'
                RoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
                StackName: !Sub '${Application}-${Environment}-aisei-site'
                TemplatePath: 'GitRepositoryArtifact::blueprints/aisei-site/infra/aisei-site.yml'
                # ContainerImageUri arrives as the digest the Build stage just pushed, so the
                # function always runs exactly the image this commit produced.
                ParameterOverrides: !Sub >-
                  {
                  "Application": "${Application}",
                  "Environment": "${Environment}",
                  "Owner": "${Owner}",
                  "BlueprintVersion": "0.1.0",
                  "DeploymentName": "aisei-site",
                  "ContainerImageUri": "#{AiseiSiteContainer.CONTAINER_DIGEST}"
                  }

            - Name: 'NotifyTopicCloudFormation'
              Namespace: 'NotifyTopicCloudFormation'
              RunOrder: 1
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Deploy'
                Owner: 'AWS'
                Provider: 'CloudFormation'
                Version: '1'
              Configuration:
                ActionMode: 'CREATE_UPDATE'
                Capabilities: 'CAPABILITY_NAMED_IAM'
                RoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
                StackName: !Sub '${Application}-${Environment}-notify-topic'
                TemplatePath: 'GitRepositoryArtifact::blueprints/notify-topic/infra/notify-topic.yml'
                # No email wired at the base instance -- that's a per-deployment choice a
                # builder makes through the Cornell Builder, not a pipeline-wide setting.
                ParameterOverrides: !Sub >-
                  {
                  "Application": "${Application}",
                  "Environment": "${Environment}",
                  "Owner": "${Owner}",
                  "SourceCommitId": "#{GitRepository.CommitId}",
                  "NotificationEmail": ""
                  }

            - Name: 'BuilderMcpCloudFormation'
              Namespace: 'BuilderMcpCloudFormation'
              RunOrder: 1
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Deploy'
                Owner: 'AWS'
                Provider: 'CloudFormation'
                Version: '1'
              Configuration:
                ActionMode: 'CREATE_UPDATE'
                Capabilities: 'CAPABILITY_NAMED_IAM'
                RoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
                StackName: !Sub '${Application}-${Environment}-builder-mcp'
                TemplatePath: 'GitRepositoryArtifact::packages/builder-mcp/infra/builder-mcp.yml'
                # ContainerImageUri is the digest the Build stage pushed. TESTING PHASE:
                # AuthMode "open" = AgentCore's default AWS IAM SigV4 (never anonymous), masking
                # the Entra authorizer. Flipping to "entra" + the EntraTenantId/EntraClientId
                # overrides: packages/builder-mcp/deploy/HANDOFF.md, "Testing phase: AuthMode=open".
                ParameterOverrides: !Sub >-
                  {
                  "Application": "${Application}",
                  "Environment": "${Environment}",
                  "Owner": "${Owner}",
                  "BlueprintVersion": "0.1.0",
                  "ContainerImageUri": "#{BuilderMcpContainer.CONTAINER_DIGEST}",
                  "GitHubTokenSecretName": "${Application}/${Environment}/builder-mcp/github-token",
                  "AuthMode": "open"
                  }

            # This action ingests then verifies inside the deploy, so it is slow and goes red when
            # the KB cannot answer the smoke query -- the intended acceptance signal, not a flake.

            - Name: 'KnowledgeBaseCloudFormation'
              Namespace: 'KnowledgeBaseCloudFormation'
              RunOrder: 1
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Deploy'
                Owner: 'AWS'
                Provider: 'CloudFormation'
                Version: '1'
              Configuration:
                ActionMode: 'CREATE_UPDATE'
                Capabilities: 'CAPABILITY_NAMED_IAM'
                RoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
                StackName: !Sub '${Application}-${Environment}-knowledgebase'
                TemplatePath: 'GitRepositoryArtifact::blueprints/knowledgebase/infra/knowledgebase.yml'
                # Params passed explicitly; BlueprintVersion kept in lockstep with the template.
                # EnableSharePointSource "true" indexes sites/kb alongside S3 -- so every track's
                # merge now depends on the Entra app's consent/grant/cert (platform-team managed);
                # roll back by setting it "false" (all SharePoint resources hang off one Condition).
                # None of the SharePoint values is a secret. EnableScheduledSync "false".
                # Full detail + warnings: blueprints/knowledgebase/docs/warnings.md.
                ParameterOverrides: !Sub >-
                  {
                  "Application": "${Application}",
                  "Environment": "${Environment}",
                  "Owner": "${Owner}",
                  "BlueprintVersion": "0.2.0",
                  "IngestionBucketName": "aidlc-kb-ingestion-890349359349",
                  "SmokeQuery": "What is the late homework policy?",
                  "EnableSharePointSource": "true",
                  "SharePointSiteUrl": "https://8chzbf.sharepoint.com/sites/kb",
                  "SharePointTenantId": "3ce7e7fb-ef51-4972-bfd5-f43f6668ccca",
                  "SharePointConnectorSecretArn": "arn:aws:secretsmanager:us-east-1:890349359349:secret:bedrock/sharepoint-cert-connector-eK6OLN",
                  "SharePointCertificateBucket": "bedrock-sharepoint-certs-890349359349",
                  "SharePointCertificateKey": "certs/certificate.p12",
                  "SharePointSmokeQuery": "What do the ECE 4960 handouts cover?",
                  "EnableScheduledSync": "false",
                  "SyncScheduleExpression": "cron(0 7 ? * MON *)",
                  "SharePointSyncScheduleExpression": "cron(0 8 ? * MON *)",
                  "SourceCommitId": "#{GitRepository.CommitId}"
                  }

            # Track C's Microsoft Teams chatbot. Generic: behaviour is set by SystemPrompt.
            # KnowledgeBaseId empty here -> answers from the prompt, no retrieval (optional by
            # design; ground it with the /aidlc/main/knowledgebase/knowledge-base-id SSM value).
            # The two Bot* values are not credentials (app id ships in every Teams manifest, tenant
            # id in every serviceUrl); the client secret + gateway api key are injected by CLI into
            # <app>/<env>/teams-bot/{bot-client-secret,gateway-api-key} (created here as placeholders),
            # and the bot answers nothing until both are put in place.
            - Name: 'TeamsBotCloudFormation'
              Namespace: 'TeamsBotCloudFormation'
              RunOrder: 1
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Deploy'
                Owner: 'AWS'
                Provider: 'CloudFormation'
                Version: '1'
              Configuration:
                ActionMode: 'CREATE_UPDATE'
                Capabilities: 'CAPABILITY_NAMED_IAM'
                RoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
                StackName: !Sub '${Application}-${Environment}-teams-bot'
                TemplatePath: 'GitRepositoryArtifact::blueprints/teams-bot/infra/teams-bot.yml'
                # Every parameter passed explicitly rather than left to template defaults, so
                # the stack deploys the same way by hand or by pipeline. BlueprintVersion is
                # duplicated from the template default on purpose: bump both in the same PR, or
                # the cornell:blueprint-version tag will lie.
                ParameterOverrides: !Sub >-
                  {
                  "Application": "${Application}",
                  "Environment": "${Environment}",
                  "Owner": "${Owner}",
                  "BlueprintVersion": "0.1.0",
                  "DeploymentName": "teams-bot",
                  "ContainerImageUri": "#{TeamsBotContainer.CONTAINER_DIGEST}",
                  "BotAppId": "e6ee0253-8949-4eba-ba9f-f9d5da45fa1d",
                  "BotTenantId": "3ce7e7fb-ef51-4972-bfd5-f43f6668ccca",
                  "ModelId": "claude-haiku-4-5",
                  "GreetingText": "",
                  "KnowledgeBaseId": "",
                  "SystemPromptS3Bucket": "",
                  "SystemPromptS3Key": "",
                  "LogRetentionDays": "90",
                  "ReservedConcurrency": "10",
                  "AlarmTopicArn": "",
                  "SourceCommitId": "#{GitRepository.CommitId}"
                  }

            # Dashboard (U-02): storage + marker at RunOrder 1, app (by digest) + site sync at
            # RunOrder 2 (both need the bucket to exist first). See deployment-architecture.md.
            - Name: 'DashboardStorageCloudFormation'
              Namespace: 'DashboardStorageCloudFormation'
              RunOrder: 1
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Deploy'
                Owner: 'AWS'
                Provider: 'CloudFormation'
                Version: '1'
              Configuration:
                ActionMode: 'CREATE_UPDATE'
                Capabilities: 'CAPABILITY_NAMED_IAM'
                RoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
                StackName: !Sub '${Application}-${Environment}-dashboard-storage'
                TemplatePath: 'GitRepositoryArtifact::blueprints/dashboard/infra/dashboard-storage.yml'
                ParameterOverrides: !Sub >-
                  {
                  "Application": "${Application}",
                  "Environment": "${Environment}",
                  "Owner": "${Owner}",
                  "BlueprintVersion": "0.1.0"
                  }

            - Name: 'DashboardMarkerCloudFormation'
              Namespace: 'DashboardMarkerCloudFormation'
              RunOrder: 1
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Deploy'
                Owner: 'AWS'
                Provider: 'CloudFormation'
                Version: '1'
              Configuration:
                ActionMode: 'CREATE_UPDATE'
                Capabilities: 'CAPABILITY_NAMED_IAM'
                RoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
                StackName: !Sub '${Application}-${Environment}-dashboard-marker'
                TemplatePath: 'GitRepositoryArtifact::blueprints/dashboard/infra/dashboard-marker.yml'
                ParameterOverrides: !Sub >-
                  {
                  "Application": "${Application}",
                  "Environment": "${Environment}",
                  "Owner": "${Owner}",
                  "BlueprintVersion": "0.1.0",
                  "SourceCommitId": "#{GitRepository.CommitId}"
                  }

            - Name: 'DashboardCloudFormation'
              Namespace: 'DashboardCloudFormation'
              RunOrder: 2
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Deploy'
                Owner: 'AWS'
                Provider: 'CloudFormation'
                Version: '1'
              Configuration:
                ActionMode: 'CREATE_UPDATE'
                Capabilities: 'CAPABILITY_NAMED_IAM'
                RoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudformation-deploy-role'
                StackName: !Sub '${Application}-${Environment}-dashboard'
                TemplatePath: 'GitRepositoryArtifact::blueprints/dashboard/infra/dashboard.yml'
                # Digests from the Build stage. AllowedIpv4Cidrs MUST be real campus ranges or the
                # WAF fails closed (template default admits no one).
                ParameterOverrides: !Sub >-
                  {
                  "Application": "${Application}",
                  "Environment": "${Environment}",
                  "Owner": "${Owner}",
                  "BlueprintVersion": "0.1.0",
                  "CollectorImageUri": "#{DashboardCollectorContainer.CONTAINER_DIGEST}",
                  "ApiImageUri": "#{DashboardApiContainer.CONTAINER_DIGEST}",
                  "AllowedIpv4Cidrs": "192.0.2.0/24",
                  "LogLevel": "INFO",
                  "SourceCommitId": "#{GitRepository.CommitId}"
                  }

            - Name: 'DashboardSiteSync'
              Namespace: 'DashboardSiteSync'
              RunOrder: 2
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Build'
                Owner: 'AWS'
                Provider: 'CodeBuild'
                Version: '1'
              Configuration:
                ProjectName: !Ref 'SiteBuildProject'
                EnvironmentVariables: !Sub >-
                  [
                  {"name": "SITE_BUCKET", "value": "${Application}-${Environment}-dashboard-site-${AWS::AccountId}", "type": "PLAINTEXT"}
                  ]

        # Non-AWS resources (Azure/Entra): one action per Terraform module (its own TF_WORKING_DIR
        # + TF_STATE_KEY, one shared CodeBuild project). Runs after BlueprintDeploy and applies
        # UNATTENDED -- no approval action, so a merge reaches the tenant with the SP's rights.
        - Name: 'Terraform'
          Actions:
            - Name: 'EntraProbeTerraform'
              Namespace: 'EntraProbeTerraform'
              RunOrder: 1
              InputArtifacts:
                - Name: 'GitRepositoryArtifact'
              ActionTypeId:
                Category: 'Build'
                Owner: 'AWS'
                Provider: 'CodeBuild'
                Version: '1'
              Configuration:
                ProjectName: !Ref 'TerraformProject'
                # validate_stacks.py text-scans for TF_WORKING_DIR here and cross-checks it
                # against the directories on disk, in both directions -- the Terraform
                # equivalent of the stacks.yml <-> pipeline.yml invariant.
                EnvironmentVariables: !Sub >-
                  [
                  {"name":"TF_WORKING_DIR","value":"blueprints/entra-probe/infra/azure","type":"PLAINTEXT"},
                  {"name":"TF_STATE_KEY","value":"${Application}/${Environment}/entra-probe.tfstate","type":"PLAINTEXT"}
                  ]

Outputs:

  PipelineName:
    Description: 'CodePipeline that deploys this repository'
    Value: !Ref 'BuildPipeline'

  PipelineConsoleUrl:
    Description: 'Watch a run here'
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${BuildPipeline}/view?region=${AWS::Region}'

  TrackedBranch:
    Description: 'Branch whose merges trigger a deploy'
    Value: !Ref 'Environment'

  ContainerRepositoryUri:
    Description: 'ECR repository for blueprint container images (no stage builds into it yet)'
    Value: !GetAtt 'ContainerRepository.RepositoryUri'

  TerraformStateBucketName:
    Description: 'S3 bucket holding Terraform state, one key per module. Retained if this stack is deleted.'
    Value: !Ref 'TerraformStateBucket'

  AzureCredentialsSecretName:
    Description: 'Inject the real credential here once: aws secretsmanager put-secret-value --secret-id <this> --secret-string file://creds.json'
    Value: !Sub '${Application}/${Environment}/azure/terraform-credentials'
