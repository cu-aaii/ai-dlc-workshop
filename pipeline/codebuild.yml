version: 0.2

# Buildspec for ContainerBuildProject in pipeline/pipeline.yml. Preserved verbatim from the
# AI Innovation Lab reference pipeline. No stage runs it yet -- it is here so that wiring a
# blueprint's Lambda container image is a Build stage action plus a Dockerfile, not a
# rediscovery of how the ECR login and digest export work.
#
# The build stage that invokes this must set CONTAINER_TARGET (the Dockerfile target to
# build), DATE_TAG (usually #{GitRepository.AuthorDate}), and CONTAINER_CONTEXT (the
# component directory containing the Dockerfile, e.g. builder-mcp). CONTAINER_DIGEST is
# exported so a downstream CloudFormation action can deploy by digest rather than by tag.

env:
  git-credential-helper: 'yes'
  exported-variables:
    - 'CONTAINER_DIGEST'

phases:

  pre_build:
    on-failure: 'ABORT'
    commands:
      - 'aws ecr get-login-password | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com'

  build:
    on-failure: 'ABORT'
    commands:
      - 'DATE_TAG=$(echo "$DATE_TAG" | tr ":" "-")'
      - >-
        docker build "$CODEBUILD_SRC_DIR/${CONTAINER_CONTEXT:-.}"
        --target $CONTAINER_TARGET
        --pull
        --tag "$CONTAINER_REPOSITORY_URI:$CONTAINER_TARGET-$DATE_TAG"

  post_build:
    on-failure: 'ABORT'
    commands:
      - 'docker push "$CONTAINER_REPOSITORY_URI:$CONTAINER_TARGET-$DATE_TAG"'
      - "export CONTAINER_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $CONTAINER_REPOSITORY_URI:$CONTAINER_TARGET-$DATE_TAG)"
