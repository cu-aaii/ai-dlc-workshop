[project]
name = "builder-mcp"
version = "0.1.0"
description = "Cornell Builder MCP server: the conversational front door onto the blueprint catalog"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
builder-mcp = "builder_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/builder_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
