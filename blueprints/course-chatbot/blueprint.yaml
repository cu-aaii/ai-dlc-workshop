# Blueprint manifest -- the contract the Cornell Builder MCP reads (product proposal §04).
# Not a CloudFormation template: it declares no template format version, so
# validate_stacks.py and cfn-lint ignore it by design (that check is a text scan, so even
# naming the marker key here would trip it). The CFN template it points at is registered in
# pipeline/stacks.yml as usual.
apiVersion: builder.cornell.edu/v1
kind: Blueprint
metadata:
  name: course-chatbot
  version: 0.1.0        # keep in lockstep with BlueprintVersion default in the template
  maintainer: ai-sei@cornell.edu
  maturity: experimental
summary: >-
  A Microsoft Teams chatbot that answers students' questions from the course's own materials.
  Bot Framework activities arrive at a public Lambda Function URL, are validated against the
  Bot Framework JWKS, grounded in passages retrieved from the course knowledge base, answered
  through Cornell's LiteLLM gateway, and replied to in the chat. It refuses rather than guessing
  when the materials do not cover a question. Internal chatbots at Cornell front on Teams, so
  the Microsoft side is a one-time registration and everything behind it runs on AWS.
# REQUIRES the knowledgebase blueprint. This one resolves the knowledge base id at deploy time
# from the SSM parameter knowledgebase publishes, which is what lets the execution role name a
# single knowledge base ARN instead of a wildcard. So it cannot deploy into an environment where
# knowledgebase has not deployed -- the pipeline action runs at RunOrder 2 for that reason, and a
# missing parameter fails the deploy with a resolution error rather than shipping a chatbot with
# nothing behind it.
# The first phrase is the demo's opening line, verbatim. blueprint_search matches on these, so
# they are written the way a person asks rather than the way the catalog is organised.
matches:
  - "I want a chatbot my students can ask questions about my course material"
  - "a chatbot for my course"
  - "teams bot"
  - "microsoft teams chatbot"
  - "answer student questions in teams"
  - "course assistant in teams"
  - "internal chatbot for a department"
inputs:
  owner_netid:
    type: string
    required: true
    description: NetID of the person who owns the deployment (cornell:owner)
# CourseName, ModelId, BotAppId and BotTenantId are deliberately NOT builder inputs, even
# though the template parameterizes all four. deployment_create forwards only Owner and the
# pipeline_parameters below into ParameterOverrides, so a value declared as an input is
# collected from the builder and then dropped -- worse than not asking (#15 finding 2). The
# two the bot cannot run without, BotAppId and BotTenantId, identify a Microsoft registration
# that a builder with no Azure access could not supply anyway: it is one-time-per-bot
# onboarding, not per-deployment configuration.
#
# CourseName and ModelId are additionally mirrored into SSM by the template and read at cold
# start. That makes them changeable without a rebuild, but do NOT treat an out-of-band edit as
# durable: their Value comes from a stack parameter, so any deploy that touches those resources
# reasserts it. Whether an untouched no-op update also reasserts is UNVERIFIED here -- the
# equivalent behaviour for AWS::SecretsManager::Secret's SecretString definitely does, which is
# why the two secrets use GenerateSecretString instead. Treat a real change as a PR.
template: blueprints/course-chatbot/infra/course-chatbot.yml
# CodePipeline-level parameters, resolved by the pipeline at deploy time (not by the MCP).
# Mirror these onto the CourseChatbotCloudFormation action's ParameterOverrides, or an action
# rendered from this manifest will deploy a different stack than the pipeline does.
# BlueprintVersion is duplicated from the template default on purpose: bump both in the same
# PR, or the cornell:blueprint-version tag will lie.
pipeline_parameters:
  BlueprintVersion: "0.1.0"
  SourceCommitId: "#{GitRepository.CommitId}"
# Not a singleton: DeploymentName is a real parameter, so several course chatbots can coexist
# per environment. Each one needs its own Microsoft registration, which is the actual limit on
# how many can exist -- not anything in this template.
singleton: false
cost:
  # Lambda and Secrets Manager only. The model spend lands on the LiteLLM gateway key rather
  # than on this AWS account, so it does not appear in this account's cost dashboard at all --
  # worth knowing before anyone reads a low number here as the total cost of the bot.
  baseline_monthly_usd: 1
  scales_with:
    - "messages answered (gateway tokens, billed outside this account)"
    - "Lambda invocations and duration"
# Student questions and the bot's answers transit the LiteLLM gateway. Medium-risk data is
# approved to and from that gateway, which is what makes this classification acceptable; the
# same traffic sent directly to a model provider would not be.
data_classification: [internal]
# Backup/recovery contract (see versioning-releases-and-recovery-options.md):
# stateless | derived | authoritative.
#
# Nothing durable yet: conversation history is not retained, so a redeploy loses no data. The
# two secrets are Retain-on-delete and hold values injected out of band, so they survive stack
# deletion by design and are not "state" this blueprint owns.
state: []
