AWSTemplateFormatVersion: '2010-09-09'
Description: 'Amazon Bedrock managed knowledge base over an existing S3 document bucket, optionally plus a SharePoint site library. Ingests on every deploy and fails the stack unless every enabled source is indexed and answerable, so a green pipeline means a query-ready knowledge base. Hands the identifiers off through SSM and a retrieval managed policy.'

Parameters:

  # Metadata Parameters

  Application:
    Default: 'aidlc'
    AllowedPattern: '[a-z0-9-]{1,10}'
    Description: 'Name used for billing and other tracking/identification purposes'
    Type: 'String'

  Environment:
    Default: 'main'
    AllowedPattern: '[a-z0-9]{1,4}'
    Description: 'Name of the deployment branch'
    Type: 'String'

  # Tagging Convention Parameters
  #
  # cornell:owner, cornell:blueprint, cornell:blueprint-version and cornell:deployment-id
  # are required on every resource. Owner and deployment id vary per deployment; blueprint
  # name and version are properties of this template, so they live here as defaults and are
  # bumped in the PR that changes the blueprint.
  #
  # AWS::Bedrock::DataSource has no Tags property at all, so DocumentDataSource cannot carry
  # them. Its identity is mirrored into SSM instead - see DataSourceIdParameter.

  Owner:
    Default: 'ai-sei'
    AllowedPattern: '.{1,128}'
    Description: 'Who owns this deployment (cornell:owner)'
    Type: 'String'

  BlueprintVersion:
    Default: '0.2.0'
    AllowedPattern: '[0-9]+\.[0-9]+\.[0-9]+'
    Description: 'Version of the knowledgebase blueprint (cornell:blueprint-version)'
    Type: 'String'

  # Blueprint Parameters

  IngestionBucketName:
    Default: 'aidlc-kb-ingestion-890349359349'
    AllowedPattern: '[a-z0-9.-]{3,63}'
    Description: 'Existing General Purpose S3 bucket holding the documents to index. Must be in the same account and region as this stack -- the managed S3 connector is same-region only, and the earlier aidlc-kb-ingestion-bucket was us-east-2, which would have failed the first create. This template references the bucket and never creates it, because a bucket it created would be empty on the deploy that created it and fail the zero-documents assertion.'
    Type: 'String'

  SmokeQuery:
    Default: 'What is the late homework policy?'
    AllowedPattern: '.{1,512}'
    Description: 'Question the deploy-time verifier asks the knowledge base. The deploy fails if this returns no results, so it has to be answerable from the documents in IngestionBucketName.'
    Type: 'String'

  # SharePoint source - ON, rehearsed first: 25 of 25 ECE 4960 handouts indexed, zero failures, clean
  # incremental re-sync, SharePoint-only smoke query answered, both verifiers passed.
  #
  # Every track's merge now depends on the Entra app's consent (Graph AND SharePoint REST), the
  # per-site grant, and an unexpired certificate. A lapse fails the verifier and reddens
  # BlueprintDeploy for everyone. Entra is managed by hand by the platform team; nothing here watches
  # the expiry. docs/warnings.md, docs/sharepoint-source.md.
  #
  # No value below is a secret - tenant id, site URL, bucket, key and secret ARN are references.

  EnableSharePointSource:
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: 'Whether to add the SharePoint data source. ON, rehearsed at 25 of 25 documents indexed with zero failures. It couples every deploy to Entra consent and certificate expiry, so a lapse there reddens the shared pipeline for every track.'
    Type: 'String'

  SharePointSiteUrl:
    Default: 'https://8chzbf.sharepoint.com/sites/kb'
    AllowedPattern: 'https://.{1,512}'
    Description: 'SharePoint site whose document library gets indexed. The Entra app needs an explicit per-site grant on this site - Sites.Selected on its own grants nothing. Ignored unless EnableSharePointSource is true.'
    Type: 'String'

  SharePointTenantId:
    Default: '3ce7e7fb-ef51-4972-bfd5-f43f6668ccca'
    AllowedPattern: '[0-9a-f-]{36}'
    Description: 'Entra directory (tenant) id. Not a secret. Ignored unless EnableSharePointSource is true.'
    Type: 'String'

  SharePointConnectorSecretArn:
    Default: 'arn:aws:secretsmanager:us-east-1:890349359349:secret:bedrock/sharepoint-cert-connector-eK6OLN'
    AllowedPattern: 'arn:aws[a-z-]*:secretsmanager:.{1,256}'
    Description: 'Secret the connector reads. For ENTRA_ID_APP_ONLY it holds exactly two camelCase keys, clientId and certificatePassword; wrong names fail with the same generic "invalid format or missing values" error as a wrong knowledge base type. Referenced by ARN, never read here.'
    Type: 'String'

  SharePointCertificateBucket:
    Default: 'bedrock-sharepoint-certs-890349359349'
    AllowedPattern: '[a-z0-9.-]{3,63}'
    Description: 'Bucket holding the .p12 client certificate. The connector fetches it itself, so it is never passed inline. Referenced, never created - a certificate cannot be generated by CloudFormation.'
    Type: 'String'

  SharePointCertificateKey:
    Default: 'certs/certificate.p12'
    AllowedPattern: '.{1,1024}'
    Description: 'Key of the .p12. Keep it under a prefix - the role grants GetObject on the prefix, not the object, because the connector probes for a sibling <key>.metadata.json.'
    Type: 'String'

  SharePointSmokeQuery:
    Default: 'What do the ECE 4960 handouts cover?'
    AllowedPattern: '.{1,512}'
    Description: 'Question the verifier asks after ingesting SharePoint. Must be answerable ONLY from SharePoint - retrieval spans the whole knowledge base. This one returns 5/5 chunks from the ECE 4960 handouts, measured; the S3 corpus is CS1112 and cannot answer it.'
    Type: 'String'

  # Scheduled re-sync - deliberately fire-and-forget, unlike everything else here.
  #
  # Bedrock has no native scheduled sync; StartIngestionJob is the only trigger. EventBridge
  # Scheduler calls it with no Lambda and no code, but CANNOT check the result: it refuses actions
  # whose names start with a read-only prefix, and that list includes get, list and retrieve. So
  # GetIngestionJob and the smoke query are structurally unreachable from a schedule.
  #
  # A scheduled sync therefore keeps the index fresh and proves NOTHING - a schedule whose jobs all
  # fail looks identical to one that works. The five assertions only ever run on a deploy. Verified
  # re-sync needs a poller (Step Functions); evaluated and deferred in docs/decisions.md.

  EnableScheduledSync:
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 'Whether to re-sync the data sources between deploys. Off by default; a failing scheduled sync is invisible - see docs/warnings.md.'
    Type: 'String'

  SyncScheduleExpression:
    Default: 'cron(0 7 ? * MON *)'
    AllowedPattern: '(cron|rate|at)\(.{1,256}\)'
    Description: 'When to re-sync the S3 source. EventBridge Scheduler syntax, UTC not local. Ignored unless EnableScheduledSync is true.'
    Type: 'String'

  SharePointSyncScheduleExpression:
    Default: 'cron(0 8 ? * MON *)'
    AllowedPattern: '(cron|rate|at)\(.{1,256}\)'
    Description: 'When to re-sync the SharePoint source. An hour after SyncScheduleExpression because ingestion jobs conflict. Ignored unless EnableScheduledSync and EnableSharePointSource are both true.'
    Type: 'String'

  # No chunking parameters, deliberately: a managed embedding model owns chunking and rejects any
  # ChunkingConfiguration at CREATE ("A chunking strategy cannot be specified with a managed
  # embedding model") while linting clean. Tuning it means EmbeddingModelType: CUSTOM plus a vector
  # store. docs/warnings.md.

  # Pipeline Provided Parameters

  SourceCommitId:
    Default: 'unknown'
    AllowedPattern: '.{1,64}'
    Description: 'Commit the pipeline deployed, passed through as #{GitRepository.CommitId}. Defaults to a placeholder so the template also deploys by hand.'
    Type: 'String'

Conditions:

  # Everything SharePoint-shaped hangs off this one condition, so an S3-only deploy renders exactly
  # as it did before SharePoint existed.
  EnableSharePoint: !Equals [!Ref 'EnableSharePointSource', 'true']

  # Gates the schedule group, its role, the S3 schedule and the SSM mirror.
  ScheduledSync: !Equals [!Ref 'EnableScheduledSync', 'true']

  # Both, because a schedule against a data source that does not exist would fail every invocation,
  # invisibly.
  SharePointScheduledSync: !And
    - !Condition 'EnableSharePoint'
    - !Condition 'ScheduledSync'

Resources:

  # The role Bedrock assumes to read the document bucket. Trust policy and statements copied from
  # the managed-knowledge-base service-role docs, including the confused-deputy and
  # aws:ResourceAccount conditions.
  #
  # The embedding-model statements are almost certainly unnecessary - a managed KB here has been
  # observed ingesting with a role holding no bedrock permission at all - and stay because four
  # read-scoped statements cost less than a failed deploy in a shared account. Do not generalise to
  # bedrock:* or Resource: '*'. docs/decisions.md.

  KnowledgeBaseRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Application}-${Environment}-knowledgebase-bedrock'
      Description: 'Service role Amazon Bedrock assumes to read documents for the knowledgebase blueprint'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service: 'bedrock.amazonaws.com'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                # The Bedrock docs use this exact capitalisation for the source ARN key.
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
      Policies:
        - PolicyName: 'embedding-models'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'bedrock:ListFoundationModels'
                  - 'bedrock:ListCustomModels'
                Resource: '*'
              - Effect: 'Allow'
                Action: 'bedrock:InvokeModel'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v1'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/cohere.embed-english-v3'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/cohere.embed-multilingual-v3'
        - PolicyName: 'read-ingestion-bucket'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: 's3:ListBucket'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${IngestionBucketName}'
                Condition:
                  StringEquals:
                    'aws:ResourceAccount': !Ref 'AWS::AccountId'
              - Effect: 'Allow'
                Action: 's3:GetObject'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${IngestionBucketName}/*'
                Condition:
                  StringEquals:
                    'aws:ResourceAccount': !Ref 'AWS::AccountId'
        # Exactly what the connector needs - the three statements the verified configuration holds.
        # GetObject is on the certificate's PREFIX, not the object: the connector probes for a
        # sibling <key>.metadata.json, and an object-scoped grant makes that a denied call. Note
        # there is no bedrock:InvokeModel here either.
        - !If
          - 'EnableSharePoint'
          - PolicyName: 'sharepoint-connector'
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: 'ReadConnectionSecret'
                  Effect: 'Allow'
                  Action: 'secretsmanager:GetSecretValue'
                  Resource: !Ref 'SharePointConnectorSecretArn'
                - Sid: 'ListCertBucket'
                  Effect: 'Allow'
                  Action: 's3:ListBucket'
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${SharePointCertificateBucket}'
                - Sid: 'ReadCert'
                  Effect: 'Allow'
                  Action: 's3:GetObject'
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${SharePointCertificateBucket}/*'
          - !Ref 'AWS::NoValue'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'iam-role-knowledgebase-bedrock'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'knowledgebase'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-knowledgebase'

  # The knowledge base itself. Type MANAGED means AWS owns the storage, the index and the
  # embedding model, so there is no StorageConfiguration, no vector store to provision and no
  # model-access gate to clear. Everything under KnowledgeBaseConfiguration is create-only:
  # changing the type or the embedding model replaces the knowledge base and loses the index.

  KnowledgeBase:
    Type: 'AWS::Bedrock::KnowledgeBase'
    Properties:
      # The Name pattern is ^([0-9a-zA-Z][_-]?){1,100}$ - single separators only, so the
      # stack-name convention fits but a doubled hyphen would not.
      Name: !Sub '${Application}-${Environment}-knowledgebase'
      Description: 'Managed knowledge base over the AI-DLC workshop document bucket'
      RoleArn: !GetAtt 'KnowledgeBaseRole.Arn'
      KnowledgeBaseConfiguration:
        Type: 'MANAGED'
        ManagedKnowledgeBaseConfiguration:
          EmbeddingModelType: 'MANAGED'
      # AWS::Bedrock::KnowledgeBase takes tags as a map, not a list of Key/Value pairs - the
      # same trap as AWS::SSM::Parameter. Every other taggable resource here uses the list.
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'bedrock-knowledge-base-knowledgebase'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'knowledgebase'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-knowledgebase'

  # Where the documents come from. A managed knowledge base reaches S3 through the managed
  # connector rather than the classic S3Configuration, and ConnectorParameters is free-form
  # Json - cfn-lint cannot validate a single key inside it. A typo here passes tools/check and
  # fails at deploy time, which is the main reason IngestionVerifier exists.
  #
  # This resource cannot be tagged at all - see DataSourceIdParameter for the SSM mirror.

  DocumentDataSource:
    Type: 'AWS::Bedrock::DataSource'
    Properties:
      Name: !Sub '${Application}-${Environment}-knowledgebase-s3'
      Description: 'Documents in the workshop ingestion bucket'
      KnowledgeBaseId: !GetAtt 'KnowledgeBase.KnowledgeBaseId'
      # RETAIN leaves the indexed vectors alone if the data source is removed, so a template
      # edit that replaces the data source does not silently empty the knowledge base.
      DataDeletionPolicy: 'RETAIN'
      DataSourceConfiguration:
        Type: 'MANAGED_KNOWLEDGE_BASE_CONNECTOR'
        ManagedKnowledgeBaseConnectorConfiguration:
          # bucketOwnerAccountId is REQUIRED, always - the connector reference calls it
          # cross-account-only and is wrong; omitting it fails with "Member must not be null".
          # And it fails by HANGING the deploy, not reddening it. Both in docs/warnings.md.
          ConnectorParameters:
            type: 'S3'
            version: '1'
            connectionConfiguration:
              bucketName: !Ref 'IngestionBucketName'
              bucketOwnerAccountId: !Ref 'AWS::AccountId'
      VectorIngestionConfiguration:
        # SMART_PARSING is the only strategy a managed knowledge base accepts, and it is the
        # default - stated explicitly anyway because the AWS CLI example for this connector does,
        # and an unstated default is one more thing that could differ from what we assume.
        ParsingConfiguration:
          ParsingStrategy: 'SMART_PARSING'
        # No ChunkingConfiguration. The managed embedding model owns chunking and rejects any
        # attempt to specify it -- verified by a failed CREATE, not inferred. See the note in
        # Parameters above.

  # The second source: same resource type, same managed connector, a different opaque Json body.
  # SharePoint is reachable from CloudFormation even though the Terraform AWS provider cannot
  # express a managed knowledge base at all. Every value is a parameter, so no certificate,
  # password or client secret is in this template.
  #
  # The body is the one observed ingesting on 2026-08-04, field for field. Do not tidy it. Three
  # fields are load-bearing in ways invisible here (all three in docs/warnings.md):
  #
  #   aclEnabled: false   ACL crawling makes Bedrock demand GroupMember.Read.All and
  #                       User.Read.All - a far larger consent ask, and why the account's earlier
  #                       quick-start SharePoint source failed every job it ever ran.
  #   crawlPages: false   Pages index as web-part JSON and compete with real documents. Narrowing
  #                       scope later does NOT purge what is already indexed.
  #   authType            ENTRA_ID_APP_ONLY. OAUTH2_APP is a password grant needing an
  #                       MFA-exempt human account.
  #
  # No bucketOwnerAccountId: that belongs to the S3 connector. This one takes secretArn, tenantId,
  # authType and certificateS3Path, and adding an unknown key hangs the deploy rather than failing
  # it.

  SharePointDataSource:
    Type: 'AWS::Bedrock::DataSource'
    Condition: 'EnableSharePoint'
    Properties:
      Name: !Sub '${Application}-${Environment}-knowledgebase-sharepoint'
      Description: 'Document library of the SharePoint site named by SharePointSiteUrl'
      KnowledgeBaseId: !GetAtt 'KnowledgeBase.KnowledgeBaseId'
      # DELETE here, RETAIN on the S3 source, and the divergence is deliberate. SharePoint has no
      # document-level deletion - "Invalid data source type [SHAREPOINTV3] provided. Only S3 and
      # Custom data source supported for document level request." Deleting the data source is the
      # only purge that exists, and it only purges if this says DELETE; RETAIN would make stale
      # chunks permanent. Cost: replacing this resource empties the SharePoint half and re-ingests
      # from zero, which the verifier asserts, so it is loud rather than silent.
      DataDeletionPolicy: 'DELETE'
      DataSourceConfiguration:
        Type: 'MANAGED_KNOWLEDGE_BASE_CONNECTOR'
        ManagedKnowledgeBaseConnectorConfiguration:
          ConnectorParameters:
            type: 'SHAREPOINT'
            version: '1'
            aclEnabled: false
            connectionConfiguration:
              secretArn: !Ref 'SharePointConnectorSecretArn'
              tenantId: !Ref 'SharePointTenantId'
              authType: 'ENTRA_ID_APP_ONLY'
              certificateS3Path:
                s3BucketName: !Ref 'SharePointCertificateBucket'
                s3KeyName: !Ref 'SharePointCertificateKey'
            dataEntityConfiguration:
              crawlFiles: true
              crawlPages: false
              siteUrls:
                - !Ref 'SharePointSiteUrl'
      VectorIngestionConfiguration:
        ParsingConfiguration:
          ParsingStrategy: 'SMART_PARSING'

  # CloudFormation creates a data source but never ingests through it, so CREATE_COMPLETE is
  # compatible with an empty knowledge base. This is a verifier, not a trigger: it ingests, asserts
  # documents were indexed with no failures, runs a retrieval smoke query, and fails the stack if
  # the knowledge base cannot answer. Do NOT soften it to fire-and-forget to make a deploy pass -
  # it is the only thing between "green pipeline" and "empty knowledge base". docs/decisions.md.

  IngestionVerifierRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Application}-${Environment}-knowledgebase-verifier'
      Description: 'Execution role for the knowledgebase blueprint deploy-time ingestion verifier'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service: 'lambda.amazonaws.com'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: 'ingest-and-verify'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'bedrock:GetDataSource'
                  - 'bedrock:StartIngestionJob'
                  - 'bedrock:GetIngestionJob'
                  - 'bedrock:Retrieve'
                Resource: !GetAtt 'KnowledgeBase.KnowledgeBaseArn'
        - PolicyName: 'write-own-logs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Application}-${Environment}-knowledgebase-verifier*'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'iam-role-knowledgebase-verifier'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'knowledgebase'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-knowledgebase'

  # Inline code, a documented exception to the repo's "Lambda means container images" rule: no stage
  # builds an image yet, and with no CLI there is nowhere to upload a bundle. Code.ZipFile is capped
  # at 4096 characters, which is why the handler is terse and uncommented. docs/decisions.md.
  #
  # Four properties exist because a custom resource that never answers leaves the stack waiting,
  # and nobody here can cancel a stuck stack: imports and clients are built INSIDE the try; poll
  # loops are bounded by get_remaining_time_in_millis, not a fixed count; botocore timeouts are
  # pinned short; send() retries. A hang is strictly worse than a red deploy - keep all four.
  # Rationale in docs/warnings.md, checklist in skills/knowledgebase/SKILL.md.

  IngestionVerifierFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      FunctionName: !Sub '${Application}-${Environment}-knowledgebase-verifier'
      Description: 'Ingests the knowledgebase data source and fails the stack unless the documents are indexed and answerable'
      Handler: 'index.handler'
      Runtime: 'python3.13'
      Role: !GetAtt 'IngestionVerifierRole.Arn'
      # Polling is deadline-driven off this value, not a fixed iteration count. Raising it
      # raises the polling budget automatically.
      Timeout: 900
      MemorySize: 256
      Code:
        ZipFile: |
          import json, time, urllib.request

          def send(e, c, status, data, reason):
              b = json.dumps({'Status': status, 'Reason': reason[:1000],
                  'PhysicalResourceId': e.get('PhysicalResourceId') or c.log_stream_name,
                  'StackId': e['StackId'], 'RequestId': e['RequestId'],
                  'LogicalResourceId': e['LogicalResourceId'], 'NoEcho': False,
                  'Data': data}).encode()
              r = urllib.request.Request(e['ResponseURL'], data=b, method='PUT',
                  headers={'content-type': '', 'content-length': str(len(b))})
              for i in range(3):
                  try:
                      urllib.request.urlopen(r, timeout=10)
                      return
                  except Exception as x:
                      print('send failed: %r' % x)
                      time.sleep(2 + 2 * i)

          def verify(e, c):
              import boto3
              from botocore.config import Config
              def left():
                  return c.get_remaining_time_in_millis() / 1000.0
              cfg = Config(connect_timeout=5, read_timeout=20,
                  retries={'max_attempts': 3, 'mode': 'standard'})
              p = e['ResourceProperties']
              kb, ds = p['KnowledgeBaseId'], p['DataSourceId']
              ba = boto3.client('bedrock-agent', config=cfg)
              br = boto3.client('bedrock-agent-runtime', config=cfg)
              s = 'unknown'
              while left() > 150:
                  s = ba.get_data_source(knowledgeBaseId=kb, dataSourceId=ds)['dataSource']['status']
                  if s == 'AVAILABLE':
                      break
                  if 'DELET' in s or 'FAIL' in s:
                      raise Exception('data source status ' + s)
                  time.sleep(10)
              if s != 'AVAILABLE':
                  raise Exception('data source stuck at ' + s)
              jid = None
              while left() > 130:
                  try:
                      jid = ba.start_ingestion_job(knowledgeBaseId=kb,
                          dataSourceId=ds)['ingestionJob']['ingestionJobId']
                      break
                  except Exception as x:
                      if 'Conflict' not in type(x).__name__:
                          raise
                      time.sleep(15)
              if not jid:
                  raise Exception('could not start an ingestion job; one may already be running')
              j = {'status': 'UNKNOWN'}
              while left() > 110:
                  j = ba.get_ingestion_job(knowledgeBaseId=kb, dataSourceId=ds,
                      ingestionJobId=jid)['ingestionJob']
                  if j['status'] in ('COMPLETE', 'FAILED', 'STOPPED'):
                      break
                  time.sleep(10)
              if j['status'] != 'COMPLETE':
                  raise Exception('ingestion %s: %s' % (j['status'], j.get('failureReasons')))
              st = j.get('statistics', {})
              scanned = st.get('numberOfDocumentsScanned', 0)
              failed = st.get('numberOfDocumentsFailed', 0)
              indexed = (st.get('numberOfNewDocumentsIndexed', 0)
                  + st.get('numberOfModifiedDocumentsIndexed', 0))
              if not scanned:
                  raise Exception('no documents scanned; check bucket contents and ConnectorParameters')
              if failed:
                  raise Exception('%d of %d documents failed ingestion' % (failed, scanned))
              hits = []
              while left() > 90 and not hits:
                  hits = br.retrieve(knowledgeBaseId=kb,
                      retrievalQuery={'text': p['SmokeQuery']})['retrievalResults']
                  if not hits:
                      time.sleep(10)
              if not hits:
                  raise Exception('smoke query returned nothing: ' + p['SmokeQuery'])
              return {'DocumentsIndexed': str(indexed), 'DocumentsScanned': str(scanned),
                  'DocumentsFailed': str(failed), 'IngestionJobId': jid,
                  'SmokeQueryResult': (hits[0].get('content') or {}).get('text', '')[:400]}

          def handler(e, c):
              print(json.dumps({k: v for k, v in e.items() if k != 'ResponseURL'}))
              try:
                  d = {} if e['RequestType'] == 'Delete' else verify(e, c)
                  send(e, c, 'SUCCESS', d, 'verified')
              except Exception as x:
                  if e['RequestType'] == 'Delete':
                      send(e, c, 'SUCCESS', {}, 'delete ignored: %r' % x)
                  else:
                      send(e, c, 'FAILED', {}, '%s: %s' % (type(x).__name__, x))
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'lambda-function-knowledgebase-verifier'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'knowledgebase'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-knowledgebase'

  # SourceCommitId is a property rather than decoration: it changes on every merge, so the
  # verifier re-runs on every deploy. Syncs are incremental, so re-running is cheap, and it
  # means "merged" implies "documents indexed and proven answerable" without any scheduler.

  IngestionVerifier:
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      ServiceToken: !GetAtt 'IngestionVerifierFunction.Arn'
      KnowledgeBaseId: !GetAtt 'KnowledgeBase.KnowledgeBaseId'
      DataSourceId: !GetAtt 'DocumentDataSource.DataSourceId'
      SmokeQuery: !Ref 'SmokeQuery'
      SourceCommitId: !Ref 'SourceCommitId'

  # A second INSTANCE of the same verifier, not a second verifier: the handler already takes
  # KnowledgeBaseId, DataSourceId and SmokeQuery as properties, so this costs zero bytes of Python -
  # which matters, because inline Code.ZipFile is capped at 4096 characters with ~280 to spare.
  #
  # DependsOn is not decoration: concurrent ingestion jobs conflict, and two instances racing would
  # burn their 900-second budgets waiting on each other.
  #
  # PROVES: the SharePoint job completed, scanned >0 documents, failed none. Those statistics are
  # per-data-source, so an empty SharePoint source cannot pass.
  # DOES NOT PROVE: that the retrieved chunk came from SharePoint - bedrock:Retrieve spans the whole
  # knowledge base. Pick a SharePointSmokeQuery only SharePoint can answer. See docs/warnings.md.

  SharePointIngestionVerifier:
    Type: 'AWS::CloudFormation::CustomResource'
    Condition: 'EnableSharePoint'
    DependsOn: 'IngestionVerifier'
    Properties:
      ServiceToken: !GetAtt 'IngestionVerifierFunction.Arn'
      KnowledgeBaseId: !GetAtt 'KnowledgeBase.KnowledgeBaseId'
      DataSourceId: !GetAtt 'SharePointDataSource.DataSourceId'
      SmokeQuery: !Ref 'SharePointSmokeQuery'
      SourceCommitId: !Ref 'SourceCommitId'

  # The retrieval seam. Downstream blueprints attach this policy instead of writing their own
  # Bedrock statements, so read access to this knowledge base stays one reviewable artifact.

  # IMMUTABLE IN PLACE. Name, Description and PolicyDocument all replace the resource, and the
  # replacement collides with the explicit name the original holds. Editing any of them means
  # renaming the policy in the same change - a document edit and then a description edit each rolled
  # main back. docs/warnings.md.
  #
  # Use Retrieve; RetrieveAndGenerate is unsupported on a managed KB (docs/sharepoint-runbook.md) and
  # is still granted only because removing it is that rename. Unusable grant, not a security issue.

  RetrievalPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: !Sub '${Application}-${Environment}-knowledgebase-retrieval'
      Description: 'Read-only retrieval against the knowledgebase blueprint knowledge base. Attach this to a consuming role rather than granting bedrock:Retrieve directly.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Action:
              - 'bedrock:Retrieve'
              - 'bedrock:RetrieveAndGenerate'
            Resource: !GetAtt 'KnowledgeBase.KnowledgeBaseArn'

  # Scheduled re-sync. Keeps the index fresh, asserts nothing - see the parameter comments above.
  #
  # AWS::Scheduler::Schedule has NO Tags property (cfn-lint rejects one with E3002), but
  # AWS::Scheduler::ScheduleGroup does. So the group carries the four cornell:* tags and gives
  # inventory a handle - the AWS::Bedrock::DataSource problem, solved by a taggable container
  # rather than by an SSM mirror.

  SyncScheduleGroup:
    Type: 'AWS::Scheduler::ScheduleGroup'
    Condition: 'ScheduledSync'
    Properties:
      Name: !Sub '${Application}-${Environment}-knowledgebase'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'scheduler-group-knowledgebase-sync'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'knowledgebase'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-knowledgebase'

  # One permission, one knowledge base. SourceArn is a !Sub of the group name rather than a !Ref to
  # SyncScheduleGroup, so the role does not depend on the group that depends on the role.

  SyncSchedulerRole:
    Type: 'AWS::IAM::Role'
    Condition: 'ScheduledSync'
    Properties:
      RoleName: !Sub '${Application}-${Environment}-knowledgebase-sync'
      Description: 'Role EventBridge Scheduler assumes to start ingestion jobs for the knowledgebase blueprint'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service: 'scheduler.amazonaws.com'
            Action: 'sts:AssumeRole'
            # Account-scoped only, unlike KnowledgeBaseRole which also pins aws:SourceArn.
            # Observed twice: an ArnLike aws:SourceArn condition naming the schedule group makes
            # every schedule create fail with "The execution role you provide must allow AWS
            # EventBridge Scheduler to assume the role" - not propagation, the second attempt had
            # four minutes of DependsOn ahead of it. Scheduler checks assumability while creating
            # the schedule, before the ARN it would pass as SourceArn exists. Given up:
            # cross-schedule scoping. The role holds one permission on one knowledge base, so the
            # worst case is someone who can already create schedules here starting an ingestion job.
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: 'start-ingestion-job'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: 'bedrock:StartIngestionJob'
                Resource: !GetAtt 'KnowledgeBase.KnowledgeBaseArn'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'iam-role-knowledgebase-sync'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'knowledgebase'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-knowledgebase'

  # The universal target: arn:aws:scheduler:::aws-sdk:{service}:{apiAction}, where {service} is the
  # SDK service identifier - bedrockagent, not bedrock-agent. Nothing validates that string;
  # cfn-lint checks the ARN's shape only, so a typo deploys clean and fails at 07:00 on a Monday
  # with nobody watching. Treat it like ConnectorParameters.
  #
  # RetryPolicy is pinned short because Scheduler's default is 185 attempts over 24 hours, which
  # turns one structural failure - a conflicting job, a revoked permission - into a day of retries.

  # DependsOn the verifier so a schedule cannot exist until the source it re-syncs is proven to
  # ingest. It also gives IAM minutes of propagation time, which is worth having but was NOT the
  # fix for the assumability error - see the trust policy on SyncSchedulerRole for that.

  DocumentSyncSchedule:
    Type: 'AWS::Scheduler::Schedule'
    Condition: 'ScheduledSync'
    DependsOn: 'IngestionVerifier'
    Properties:
      Name: !Sub '${Application}-${Environment}-knowledgebase-s3'
      Description: 'Re-syncs the S3 data source. Starts an ingestion job and does not check the outcome.'
      GroupName: !Ref 'SyncScheduleGroup'
      ScheduleExpression: !Ref 'SyncScheduleExpression'
      # Explicit rather than defaulted: an unqualified cron here is UTC, so "cron(0 7 ...)" is
      # 03:00 Ithaca time in summer. Stating it stops that being a surprise.
      ScheduleExpressionTimezone: 'Etc/UTC'
      State: 'ENABLED'
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: 'arn:aws:scheduler:::aws-sdk:bedrockagent:startIngestionJob'
        RoleArn: !GetAtt 'SyncSchedulerRole.Arn'
        Input: !Sub
          - '{"KnowledgeBaseId":"${KnowledgeBaseId}","DataSourceId":"${DataSourceId}"}'
          - KnowledgeBaseId: !GetAtt 'KnowledgeBase.KnowledgeBaseId'
            DataSourceId: !GetAtt 'DocumentDataSource.DataSourceId'
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 900

  SharePointSyncSchedule:
    Type: 'AWS::Scheduler::Schedule'
    Condition: 'SharePointScheduledSync'
    DependsOn: 'SharePointIngestionVerifier'
    Properties:
      Name: !Sub '${Application}-${Environment}-knowledgebase-sharepoint'
      Description: 'Re-syncs the SharePoint data source. Starts an ingestion job and does not check the outcome - including whether the certificate still works.'
      GroupName: !Ref 'SyncScheduleGroup'
      ScheduleExpression: !Ref 'SharePointSyncScheduleExpression'
      ScheduleExpressionTimezone: 'Etc/UTC'
      State: 'ENABLED'
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: 'arn:aws:scheduler:::aws-sdk:bedrockagent:startIngestionJob'
        RoleArn: !GetAtt 'SyncSchedulerRole.Arn'
        Input: !Sub
          - '{"KnowledgeBaseId":"${KnowledgeBaseId}","DataSourceId":"${DataSourceId}"}'
          - KnowledgeBaseId: !GetAtt 'KnowledgeBase.KnowledgeBaseId'
            DataSourceId: !GetAtt 'SharePointDataSource.DataSourceId'
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 900

  # Handoff. Consumers read these parameters rather than a CloudFormation Export, which would
  # tie their stack's lifecycle to this one and block replacing the knowledge base.

  KnowledgeBaseIdParameter:
    Type: 'AWS::SSM::Parameter'
    Properties:
      Name: !Sub '/${Application}/${Environment}/knowledgebase/knowledge-base-id'
      Description: 'Id of the managed knowledge base to query'
      Tier: 'Standard'
      Type: 'String'
      Value: !GetAtt 'KnowledgeBase.KnowledgeBaseId'
      # AWS::SSM::Parameter takes tags as a map, not a list of Key/Value pairs.
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'ssm-parameter-knowledgebase-id'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'knowledgebase'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-knowledgebase'

  # AWS::Bedrock::DataSource is untaggable, so this parameter is the only place tag-based
  # inventory can pick the data source up. Deleting it hides the data source from Track E.

  DataSourceIdParameter:
    Type: 'AWS::SSM::Parameter'
    Properties:
      Name: !Sub '/${Application}/${Environment}/knowledgebase/data-source-id'
      Description: 'Id of the S3 data source. Mirrored here because AWS::Bedrock::DataSource cannot be tagged.'
      Tier: 'Standard'
      Type: 'String'
      Value: !GetAtt 'DocumentDataSource.DataSourceId'
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'ssm-parameter-knowledgebase-data-source-id'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'knowledgebase'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-knowledgebase'

  # Same reason as DataSourceIdParameter: untaggable resource, so this is inventory's only join key
  # for the SharePoint source. The site URL rides along - readable, and not a secret.

  SharePointDataSourceIdParameter:
    Type: 'AWS::SSM::Parameter'
    Condition: 'EnableSharePoint'
    Properties:
      Name: !Sub '/${Application}/${Environment}/knowledgebase/sharepoint-data-source-id'
      Description: 'Id of the SharePoint data source, and the site it indexes. Mirrored here because AWS::Bedrock::DataSource cannot be tagged.'
      Tier: 'Standard'
      Type: 'String'
      Value: !Sub
        - '${DataSourceId} ${SharePointSiteUrl}'
        - DataSourceId: !GetAtt 'SharePointDataSource.DataSourceId'
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'ssm-parameter-knowledgebase-sharepoint-data-source-id'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'knowledgebase'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-knowledgebase'

  IngestionBucketParameter:
    Type: 'AWS::SSM::Parameter'
    Properties:
      Name: !Sub '/${Application}/${Environment}/knowledgebase/ingestion-bucket'
      Description: 'Bucket the knowledge base indexes. Created outside IaC, so it carries none of the cornell:* tags.'
      Tier: 'Standard'
      Type: 'String'
      Value: !Ref 'IngestionBucketName'
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'ssm-parameter-knowledgebase-ingestion-bucket'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'knowledgebase'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-knowledgebase'

  RetrievalPolicyArnParameter:
    Type: 'AWS::SSM::Parameter'
    Properties:
      Name: !Sub '/${Application}/${Environment}/knowledgebase/retrieval-policy-arn'
      Description: 'Managed policy a consuming role attaches to query the knowledge base'
      Tier: 'Standard'
      Type: 'String'
      Value: !Ref 'RetrievalPolicy'
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'ssm-parameter-knowledgebase-retrieval-policy-arn'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'knowledgebase'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-knowledgebase'

  # Records which commit produced the running stack. Reading this back is the cheapest
  # proof that a merge actually flowed through to a deployed resource.

  DeploymentMarkerParameter:
    Type: 'AWS::SSM::Parameter'
    Properties:
      Name: !Sub '/${Application}/${Environment}/knowledgebase/deployed-commit'
      Description: 'Commit id of the last pipeline deploy of the knowledgebase blueprint'
      Tier: 'Standard'
      Type: 'String'
      Value: !Ref 'SourceCommitId'
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'ssm-parameter-knowledgebase-deployment-marker'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'knowledgebase'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-knowledgebase'

  # The verifier's own findings, so what the last deploy actually proved is readable without
  # digging through CloudFormation events or Lambda logs.

  LastIngestionResultParameter:
    Type: 'AWS::SSM::Parameter'
    Properties:
      Name: !Sub '/${Application}/${Environment}/knowledgebase/last-ingestion-result'
      Description: 'Documents indexed by the last verified ingestion, and the job that did it'
      Tier: 'Standard'
      Type: 'String'
      Value: !Sub
        - 'indexed=${Indexed} scanned=${Scanned} failed=${Failed} job=${Job} commit=${SourceCommitId}'
        - Indexed: !GetAtt 'IngestionVerifier.DocumentsIndexed'
          Scanned: !GetAtt 'IngestionVerifier.DocumentsScanned'
          Failed: !GetAtt 'IngestionVerifier.DocumentsFailed'
          Job: !GetAtt 'IngestionVerifier.IngestionJobId'
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'ssm-parameter-knowledgebase-last-ingestion-result'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'knowledgebase'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-knowledgebase'

  SharePointLastIngestionResultParameter:
    Type: 'AWS::SSM::Parameter'
    Condition: 'EnableSharePoint'
    Properties:
      Name: !Sub '/${Application}/${Environment}/knowledgebase/sharepoint-last-ingestion-result'
      Description: 'Documents indexed by the last verified SharePoint ingestion, and the job that did it'
      Tier: 'Standard'
      Type: 'String'
      Value: !Sub
        - 'indexed=${Indexed} scanned=${Scanned} failed=${Failed} job=${Job} commit=${SourceCommitId}'
        - Indexed: !GetAtt 'SharePointIngestionVerifier.DocumentsIndexed'
          Scanned: !GetAtt 'SharePointIngestionVerifier.DocumentsScanned'
          Failed: !GetAtt 'SharePointIngestionVerifier.DocumentsFailed'
          Job: !GetAtt 'SharePointIngestionVerifier.IngestionJobId'
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'ssm-parameter-knowledgebase-sharepoint-last-ingestion-result'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'knowledgebase'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-knowledgebase'

  # What the scheduled syncs are configured to do - NOT what they did. Deliberately a configuration
  # record, because there is no result to record: Scheduler cannot call GetIngestionJob, so nothing
  # here ever learns the outcome. The last-ingestion-result parameters beside it describe the last
  # DEPLOY. Reading either as "syncs are healthy" is the mistake the value's wording resists.

  SyncScheduleParameter:
    Type: 'AWS::SSM::Parameter'
    Condition: 'ScheduledSync'
    Properties:
      Name: !Sub '/${Application}/${Environment}/knowledgebase/sync-schedule'
      Description: 'Scheduled re-sync configuration. Fire-and-forget: no outcome is recorded anywhere, by design of the Scheduler universal target.'
      Tier: 'Standard'
      Type: 'String'
      Value: !Sub
        - 'group=${Application}-${Environment}-knowledgebase s3=${SyncScheduleExpression} sharepoint=${SharePointExpression} timezone=Etc/UTC outcomes=not-recorded'
        - SharePointExpression: !If
            - 'SharePointScheduledSync'
            - !Ref 'SharePointSyncScheduleExpression'
            - 'disabled'
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'ssm-parameter-knowledgebase-sync-schedule'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'knowledgebase'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-knowledgebase'

Outputs:

  KnowledgeBaseId:
    Description: 'Id of the managed knowledge base. This is what a consumer passes to bedrock-agent-runtime.'
    Value: !GetAtt 'KnowledgeBase.KnowledgeBaseId'

  KnowledgeBaseArn:
    Description: 'ARN of the managed knowledge base'
    Value: !GetAtt 'KnowledgeBase.KnowledgeBaseArn'

  DataSourceId:
    Description: 'Id of the S3 data source, needed to start a manual re-sync'
    Value: !GetAtt 'DocumentDataSource.DataSourceId'

  # Absent entirely on an S3-only deploy. Consumers should read SSM; these exist so a rehearsal can
  # confirm the SharePoint half from describe-stacks in one call.

  SharePointDataSourceId:
    Condition: 'EnableSharePoint'
    Description: 'Id of the SharePoint data source. Changes on replacement, which empties and re-ingests the SharePoint half.'
    Value: !GetAtt 'SharePointDataSource.DataSourceId'

  SharePointDocumentsIndexed:
    Condition: 'EnableSharePoint'
    Description: 'Documents indexed from SharePoint. Non-zero proves the consent, certificate and per-site grant are all still good.'
    Value: !GetAtt 'SharePointIngestionVerifier.DocumentsIndexed'

  SharePointSmokeQueryResult:
    Condition: 'EnableSharePoint'
    Description: 'Top chunk for SharePointSmokeQuery, truncated. Read it - retrieval spans the whole KB, so an S3 document can answer it.'
    Value: !GetAtt 'SharePointIngestionVerifier.SmokeQueryResult'

  RetrievalPolicyArn:
    Description: 'Managed policy granting bedrock:Retrieve on this knowledge base. Not RetrieveAndGenerate - unsupported on a managed KB.'
    Value: !Ref 'RetrievalPolicy'

  IngestionBucketName:
    Description: 'Bucket whose contents this knowledge base indexes'
    Value: !Ref 'IngestionBucketName'

  DocumentsIndexed:
    Description: 'Documents the deploy-time verifier indexed. A non-zero value here is the proof the deploy produced a populated knowledge base.'
    Value: !GetAtt 'IngestionVerifier.DocumentsIndexed'

  SmokeQueryResult:
    Description: 'Top chunk the verifier retrieved for SmokeQuery, truncated. Proof the knowledge base answers.'
    Value: !GetAtt 'IngestionVerifier.SmokeQueryResult'

  DeploymentId:
    Description: 'Value of the cornell:deployment-id tag on every resource in this stack'
    Value: !Sub '${Application}-${Environment}-knowledgebase'

  BlueprintVersion:
    Description: 'Value of the cornell:blueprint-version tag'
    Value: !Ref 'BlueprintVersion'

  ScheduledSyncStatus:
    Condition: 'ScheduledSync'
    Description: 'Scheduled re-sync expressions, UTC. These start jobs and verify nothing; only a green deploy proves the KB answers.'
    Value: !Sub
      - 's3=${SyncScheduleExpression} sharepoint=${SharePointExpression}'
      - SharePointExpression: !If
          - 'SharePointScheduledSync'
          - !Ref 'SharePointSyncScheduleExpression'
          - 'disabled'

  DeployedCommitId:
    Description: 'Commit this stack was deployed from'
    Value: !Ref 'SourceCommitId'
