# Resolved dependency set for the teams-bot Lambda image — the lock file SECURITY-10 requires.
#
# requirements.txt declares INTENT as version ranges; this file is the exact resolved set the image
# installs, so two builds of the same commit cannot resolve differently. That drift is the whole
# reason the rule exists.
#
# Regenerate after editing requirements.txt:
#   uv pip compile blueprints/teams-bot/src/requirements.txt \
#       --python-version 3.13 -o blueprints/teams-bot/src/requirements.lock
#
# boto3 is deliberately absent: the AWS Lambda Python base image ships it. Adding it here would
# shadow the runtime's own copy with a second, unpinned-against-the-runtime version.
#
# Vulnerability scanning (SECURITY-10) is not wired into tools/check, which is a shared file. Run it
# against this file before a release:
#   uvx pip-audit -r blueprints/teams-bot/src/requirements.lock
