AWSTemplateFormatVersion: '2010-09-09'
Description: 'teams-bot (Track C): a Microsoft Teams chatbot. Bot Framework activities arrive at a public Lambda Function URL, are validated against the Bot Framework JWKS, answered via Cornell''s LiteLLM gateway, and replied to through the Bot Framework API. Image built from blueprints/teams-bot/Dockerfile (target teams-bot, arm64). Step 2 replaces the in-Lambda model call with an AgentCore Runtime invoke -- see aidlc-docs/inception/plans/units-generation-clarification-questions.md.'

Parameters:

  # Metadata Parameters

  Application:
    Default: 'aidlc'
    AllowedPattern: '[a-z0-9-]{1,10}'
    Description: 'Name used for billing and other tracking/identification purposes'
    Type: 'String'

  Environment:
    Default: 'main'
    AllowedPattern: '[a-z0-9]{1,4}'
    Description: 'Name of the deployment branch'
    Type: 'String'

  # Tagging Convention Parameters
  #
  # All four cornell:* tags are required on every resource. Owner and deployment id vary per
  # deployment; blueprint name and version are properties of this template, so they live
  # here as defaults and are bumped in the PR that changes the blueprint.

  Owner:
    Default: 'ai-sei'
    AllowedPattern: '.{1,128}'
    Description: 'Who owns this deployment (cornell:owner)'
    Type: 'String'

  BlueprintVersion:
    Default: '0.1.0'
    AllowedPattern: '[0-9]+\.[0-9]+\.[0-9]+'
    Description: 'Version of the teams-bot blueprint (cornell:blueprint-version)'
    Type: 'String'

  # Deploy Parameters

  # Part of the function name and the cornell:deployment-id, so several course chatbots can
  # coexist per environment. The lookahead caps total length at 2-20 characters; the body
  # forbids leading, trailing and consecutive hyphens.

  DeploymentName:
    Default: 'teams-bot'
    AllowedPattern: '(?=[a-z0-9-]{2,20}$)[a-z0-9]+(-[a-z0-9]+)*'
    Description: 'Instance name for this deployment. Lowercase alphanumerics with single hyphens, 2-20 chars.'
    Type: 'String'

  ContainerImageUri:
    Default: ''
    AllowedPattern: '.{0,512}'
    Description: 'Image for the function, normally the digest URI the pipeline Build stage exports (#{TeamsBotContainer.CONTAINER_DIGEST}). Empty deploys no function, so the template still validates before its Build action is wired.'
    Type: 'String'

  # Bot Framework Parameters
  #
  # The Entra application (client) id is NOT a secret -- it is the aud claim every inbound
  # activity is validated against (FR-8), and hardcoding it in code is forbidden. The
  # matching client secret never appears here; see BotClientSecret below.

  BotAppId:
    Default: ''
    AllowedPattern: '.{0,64}'
    Description: 'Entra application (client) id of the Azure Bot registration. Validated as the inbound JWT aud claim and used for the outbound client_credentials grant. Empty disables JWT validation ONLY in the sense that the function will reject everything -- absence fails closed.'
    Type: 'String'

  BotTenantId:
    Default: ''
    AllowedPattern: '.{0,64}'
    Description: 'Entra tenant id for the outbound token endpoint (single-tenant bot).'
    Type: 'String'

  # Behaviour Parameters
  #
  # NOTE (#15 finding 2): deployment_create passes only Application, Environment, Owner and
  # the manifest's pipeline_parameters. Values declared under a manifest's `inputs` are
  # collected from the builder and then DROPPED. Anything a builder configures must
  # therefore arrive as a pipeline parameter or be read from SSM at runtime -- which is why
  # the prompt and course name are mirrored into SSM below.

  ModelId:
    Default: 'claude-haiku-4-5'
    AllowedPattern: '.{1,128}'
    Description: 'Model id as the LiteLLM gateway names it (gateway naming, not Bedrock native ids).'
    Type: 'String'

  # A CloudFormation parameter value caps at 4096 characters and an SSM standard parameter
  # at 4 KB, so a long syllabus-bearing prompt belongs in S3 with the key passed instead
  # (FR-3a). Empty means "use the built-in prompt".

  SystemPromptS3Bucket:
    Default: ''
    AllowedPattern: '.{0,64}'
    Description: 'Optional bucket holding the system prompt, for prompts over 4096 characters (FR-3a).'
    Type: 'String'

  SystemPromptS3Key:
    Default: ''
    AllowedPattern: '.{0,256}'
    Description: 'Optional key of the system prompt object in SystemPromptS3Bucket.'
    Type: 'String'

  GreetingText:
    Default: ''
    AllowedPattern: '.{0,512}'
    Description: 'Sent when a human joins the conversation. Empty falls back to a generic greeting.'
    Type: 'String'

  # OPTIONAL, and optional is the requirement (FR-4): "the parameter surface MUST accommodate a
  # future KnowledgeBaseId without redesign." A Teams bot blueprint must deploy with no knowledge
  # base at all -- retrieval is a capability tier, not a prerequisite.
  #
  # This was previously an AWS::SSM::Parameter::Value<String> pointed at the knowledgebase
  # blueprint's published path. That resolved at deploy time, which bought a precisely-scoped IAM
  # grant but made this stack UNDEPLOYABLE without that blueprint -- a hard cross-blueprint
  # dependency in a building block meant to stand alone.
  #
  # Plain string keeps least privilege (the grant below is conditional and names this exact id) and
  # keeps the blueprint independent. The cost is that a caller must supply the id rather than having
  # it resolved for them:
  #   aws ssm get-parameter --name /<app>/<env>/knowledgebase/knowledge-base-id \
  #     --query Parameter.Value --output text
  # Empty means no retrieval: the bot answers from its system prompt alone and says so.
  KnowledgeBaseId:
    Default: ''
    AllowedPattern: '[A-Z0-9]{0,32}'
    Description: 'Optional Bedrock knowledge base id to ground answers in. Empty disables retrieval entirely.'
    Type: 'String'

  LogRetentionDays:
    Default: 90
    AllowedValues: [90, 180, 365]
    Description: 'CloudWatch retention. SECURITY-14 requires at least 90 days.'
    Type: 'Number'

  # SECURITY-11 requires rate limiting on public-facing endpoints. A Lambda Function URL has no
  # built-in throttling, so reserved concurrency is the only lever available in the stack.
  #
  # Recorded honestly: this bounds blast radius and cost, it does NOT prevent abuse. A caller who
  # floods the endpoint still gets served up to this many concurrent invocations and still spends
  # gateway tokens; what it prevents is one bot consuming the account's whole concurrency pool.
  # Real rate limiting needs an intermediary the Function URL choice deliberately omitted.
  ReservedConcurrency:
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: 'Maximum concurrent executions. Blast-radius control, not abuse prevention (SECURITY-11).'
    Type: 'Number'

  # SECURITY-14 requires alerting on repeated authentication failures. Empty means the alarm still
  # exists and still changes state -- so it is visible in the console and to track E's dashboard --
  # but notifies nobody. Point it at the notify-topic blueprint's topic to make it reach a human.
  AlarmTopicArn:
    Default: ''
    AllowedPattern: '.{0,256}'
    Description: 'Optional SNS topic for the inbound-validation-failure alarm. Empty means the alarm notifies nobody.'
    Type: 'String'

  # Pipeline Provided Parameters

  SourceCommitId:
    Default: 'unknown'
    AllowedPattern: '.{1,64}'
    Description: 'Commit the pipeline deployed, passed through as #{GitRepository.CommitId}. Defaults to a placeholder so the template also deploys by hand.'
    Type: 'String'

Conditions:

  HasImage: !Not [!Equals [!Ref 'ContainerImageUri', '']]
  HasPromptBucket: !Not [!Equals [!Ref 'SystemPromptS3Bucket', '']]
  HasAlarmTopic: !Not [!Equals [!Ref 'AlarmTopicArn', '']]
  HasKnowledgeBase: !Not [!Equals [!Ref 'KnowledgeBaseId', '']]

Resources:

  # --- Secrets -------------------------------------------------------------------------
  #
  # Both secrets declare their RESOURCE here and never their VALUE. GenerateSecretString is
  # evaluated only at create, so PipelineDeploy redeploying this stack on every merge to
  # main cannot clobber the injected value. A SecretString property WOULD be reasserted on
  # every update, resetting the live credential to a placeholder several times a day.
  #
  # Inject once, by CLI:
  #   aws secretsmanager put-secret-value --secret-id <name> --secret-string '<value>'
  #
  # Editing the GenerateSecretString block later DOES clobber it. Don't.

  BotClientSecret:
    Type: 'AWS::SecretsManager::Secret'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      Name: !Sub '${Application}/${Environment}/${DeploymentName}/bot-client-secret'
      Description: 'Entra client secret for the Azure Bot registration. Value injected by CLI, never in git.'
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'teams-bot'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-${DeploymentName}'

  GatewayApiKeySecret:
    Type: 'AWS::SecretsManager::Secret'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      Name: !Sub '${Application}/${Environment}/${DeploymentName}/gateway-api-key'
      Description: 'LiteLLM gateway service key for this bot (FR-23a -- a service key, never a person''s key). Value injected by CLI.'
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'teams-bot'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-${DeploymentName}'

  # --- Configuration the builder cannot pass as a parameter ------------------------------
  #
  # AWS::SSM::Parameter takes Tags as a MAP, not the usual list of Key/Value pairs.


  ModelIdParameter:
    Type: 'AWS::SSM::Parameter'
    Properties:
      Name: !Sub '/${Application}/${Environment}/${DeploymentName}/model-id'
      Type: 'String'
      Value: !Ref 'ModelId'
      Description: 'Gateway model id. Read at cold start.'
      Tags:
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'teams-bot'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-${DeploymentName}'

  # --- Logs ------------------------------------------------------------------------------
  #
  # Declared explicitly rather than left to Lambda's implicit creation, so retention is
  # enforced (SECURITY-14) and the execution role can be scoped to this group alone.

  FrontDoorLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Application}-${Environment}-${DeploymentName}'
      RetentionInDays: !Ref 'LogRetentionDays'
      Tags:
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'teams-bot'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-${DeploymentName}'

  # --- Execution role --------------------------------------------------------------------
  #
  # No wildcard actions and no wildcard resources (SECURITY-06). Log permissions are scoped
  # to this function's own group and deliberately EXCLUDE Delete*, so the function cannot
  # destroy its own audit trail (SECURITY-14).

  FrontDoorRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Application}-${Environment}-${DeploymentName}-frontdoor'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service: 'lambda.amazonaws.com'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: 'logs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Application}-${Environment}-${DeploymentName}:*'
        - PolicyName: 'secrets'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: 'secretsmanager:GetSecretValue'
                Resource:
                  - !Ref 'BotClientSecret'
                  - !Ref 'GatewayApiKeySecret'
        - PolicyName: 'config'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: 'ssm:GetParameter'
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Application}/${Environment}/${DeploymentName}/*'
      Tags:
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'teams-bot'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-${DeploymentName}'

  # A separate managed policy so the prompt-bucket grant appears only when a bucket is
  # supplied -- an unconditional statement would need a wildcard resource when empty.

  # Conditional, so a deployment with no knowledge base carries no Bedrock grant at all rather
  # than a wildcard one. Retrieve and ONLY Retrieve: RetrieveAndGenerate and AgenticRetrieveStream
  # both invoke a Bedrock foundation model internally, which would put generation outside Cornell's
  # LiteLLM gateway and break the routing mandate. Retrieve makes no model call.

  KnowledgeBasePolicy:
    Type: 'AWS::IAM::RolePolicy'
    Condition: 'HasKnowledgeBase'
    Properties:
      PolicyName: 'knowledge-base'
      RoleName: !Ref 'FrontDoorRole'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Action: 'bedrock:Retrieve'
            Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}'

  PromptBucketPolicy:
    Type: 'AWS::IAM::RolePolicy'
    Condition: 'HasPromptBucket'
    Properties:
      PolicyName: 'system-prompt'
      RoleName: !Ref 'FrontDoorRole'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Action: 's3:GetObject'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${SystemPromptS3Bucket}/*'

  # --- The front door --------------------------------------------------------------------
  #
  # FunctionName is deterministic on purpose (FR-7): CloudFormation replacing the function
  # would issue a NEW Function URL, and the URL is configured on the Azure Bot resource as
  # the messaging endpoint. A replacement therefore costs a manual Azure edit.
  #
  # Timeout is set EXPLICITLY. The 3-second default would truncate every reply -- this
  # function holds the request open while the model works. Teams' own acknowledgement budget
  # is 10-15 seconds depending on channel, and overrunning it shows the user
  # 504:GatewayTimeout, so 60 seconds here is a failure ceiling rather than a target.

  FrontDoorFunction:
    Type: 'AWS::Lambda::Function'
    Condition: 'HasImage'
    Properties:
      FunctionName: !Sub '${Application}-${Environment}-${DeploymentName}'
      Description: 'Bot Framework front door for the Teams course chatbot'
      Role: !GetAtt 'FrontDoorRole.Arn'
      PackageType: 'Image'
      Code:
        ImageUri: !Ref 'ContainerImageUri'
      Architectures: ['arm64']
      MemorySize: 1024
      Timeout: 60
      ReservedConcurrentExecutions: !Ref 'ReservedConcurrency'
      LoggingConfig:
        LogGroup: !Ref 'FrontDoorLogGroup'
      Environment:
        Variables:
          PYTHONUNBUFFERED: '1'
          LOG_LEVEL: 'INFO'
          GREETING_TEXT: !Ref 'GreetingText'
          BOT_APP_ID: !Ref 'BotAppId'
          BOT_TENANT_ID: !Ref 'BotTenantId'
          BOT_CLIENT_SECRET_ARN: !Ref 'BotClientSecret'
          GATEWAY_API_KEY_ARN: !Ref 'GatewayApiKeySecret'
          GATEWAY_BASE_URL: 'https://api.ai.it.cornell.edu'
          MODEL_ID_PARAM: !Ref 'ModelIdParameter'
          KNOWLEDGE_BASE_ID: !Ref 'KnowledgeBaseId'
          SYSTEM_PROMPT_S3_BUCKET: !Ref 'SystemPromptS3Bucket'
          SYSTEM_PROMPT_S3_KEY: !Ref 'SystemPromptS3Key'
          DEPLOYMENT_ID: !Sub '${Application}-${Environment}-${DeploymentName}'
      Tags:
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'teams-bot'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-${DeploymentName}'

  # AuthType NONE is required by design: Azure Bot Service must reach this endpoint and its
  # source addresses are not fixed, so there is no IAM caller to authenticate. This is the
  # SECURITY-07 public-facing exception, and authorisation is enforced at the application
  # layer -- every request's Bot Framework JWT is validated, including the serviceurl
  # correlation, before any action is taken (FR-8).

  FrontDoorUrl:
    Type: 'AWS::Lambda::Url'
    Condition: 'HasImage'
    Properties:
      TargetFunctionArn: !GetAtt 'FrontDoorFunction.Arn'
      AuthType: 'NONE'

  FrontDoorUrlPermission:
    Type: 'AWS::Lambda::Permission'
    Condition: 'HasImage'
    Properties:
      FunctionName: !GetAtt 'FrontDoorFunction.Arn'
      Action: 'lambda:InvokeFunctionUrl'
      Principal: '*'
      FunctionUrlAuthType: 'NONE'

  # --- Alerting on rejected inbound activities (SECURITY-14) -----------------------------
  #
  # The metric is derived from the handler's own log line rather than from a Lambda metric,
  # because "the token was rejected" is not an invocation error -- the function returns 200 by
  # design (FR-10), so Errors and Throttles both stay flat while an attacker hammers it. A log
  # filter is the only place that signal exists.
  #
  # The pattern matches exactly one log line in the handler -- the ValidationError branch, which
  # emits "rejected activity: correlation=... type=... reason=...". Note "accepted activity:" is
  # the neighbouring success line and deliberately does not match.
  #
  # This couples an alarm to a log string, which is fragile in one specific way: changing the
  # handler's message without changing this pattern disables the alarm **silently** -- no error,
  # no failed deploy, just a metric that never increments again. If that line is edited, edit
  # this too.

  ValidationFailureMetricFilter:
    Type: 'AWS::Logs::MetricFilter'
    Properties:
      LogGroupName: !Ref 'FrontDoorLogGroup'
      FilterPattern: '"rejected activity"'
      MetricTransformations:
        - MetricNamespace: !Sub '${Application}/${Environment}/teams-bot'
          MetricName: 'InboundValidationFailures'
          MetricValue: '1'
          DefaultValue: 0

  ValidationFailureAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub '${Application}-${Environment}-${DeploymentName}-validation-failures'
      AlarmDescription: 'Repeated rejected inbound activities: forged or misdirected Bot Framework requests, or a broken bot registration.'
      Namespace: !Sub '${Application}/${Environment}/teams-bot'
      MetricName: 'InboundValidationFailures'
      Statistic: 'Sum'
      Period: 300
      EvaluationPeriods: 1
      # Five in five minutes. A single rejection is normal noise on a public endpoint -- an
      # expired token, a stray scanner. A sustained rate is the thing worth waking up for.
      Threshold: 5
      ComparisonOperator: 'GreaterThanOrEqualToThreshold'
      TreatMissingData: 'notBreaching'
      AlarmActions: !If
        - 'HasAlarmTopic'
        - [!Ref 'AlarmTopicArn']
        - !Ref 'AWS::NoValue'

Outputs:

  # Read by the post-deploy step that pushes the messaging endpoint to Azure:
  #   az bot update --name <bot> --resource-group <rg> --endpoint <this>/api/messages
  # A human transcribing this value is what FR-7a withdrew.

  FunctionUrl:
    Condition: 'HasImage'
    Description: 'Public HTTPS endpoint. Set as the Azure Bot messaging endpoint.'
    Value: !GetAtt 'FrontDoorUrl.FunctionUrl'

  DeployedCommitId:
    Description: 'Commit this stack was deployed from'
    Value: !Ref 'SourceCommitId'

  BotClientSecretArn:
    Description: 'ARN of the Entra client secret. Inject the value with put-secret-value; it is never in git.'
    Value: !Ref 'BotClientSecret'

  GatewayApiKeySecretArn:
    Description: 'ARN of the LiteLLM gateway service key. Inject the value with put-secret-value.'
    Value: !Ref 'GatewayApiKeySecret'
