AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cornell Builder MCP server on Bedrock AgentCore Runtime: execution role, the runtime itself, and AuthMode-switched inbound auth (testing-phase open = AWS IAM SigV4, the AgentCore default; entra = the stashed Microsoft Entra ID client-credentials authorizer). Deployed by the pipeline BlueprintDeploy stage; its image is built by the Build stage from builder-mcp/Dockerfile (target builder-mcp) and pinned by digest.'

Parameters:

  # Metadata Parameters

  Application:
    Default: 'aidlc'
    AllowedPattern: '[a-z0-9-]{1,10}'
    Description: 'Name used for billing and other tracking/identification purposes'
    Type: 'String'

  Environment:
    Default: 'main'
    AllowedPattern: '[a-z0-9]{1,4}'
    Description: 'Name of the deployment branch'
    Type: 'String'

  Owner:
    Default: 'ai-sei'
    AllowedPattern: '.{1,128}'
    Description: 'Who owns this deployment (cornell:owner)'
    Type: 'String'

  BlueprintVersion:
    Default: '0.1.0'
    AllowedPattern: '[0-9]+\.[0-9]+\.[0-9]+'
    Description: 'Version of the builder-mcp component (cornell:blueprint-version)'
    Type: 'String'

  # Deploy Parameters

  ContainerImageUri:
    Default: ''
    AllowedPattern: '.{0,512}'
    Description: 'Image for the runtime, normally the digest URI the pipeline Build stage exports (#{BuilderMcpContainer.CONTAINER_DIGEST}). Empty deploys everything except the runtime, for bootstrap and debugging.'
    Type: 'String'

  GitHubTokenSecretName:
    Default: 'aidlc/main/builder-mcp/github-token'
    AllowedPattern: '.{1,256}'
    Description: 'Secrets Manager secret holding the server-side GitHub token. The secret itself is created by hand and never appears in this repo.'
    Type: 'String'

  # ------------------------------------------------------------------------------------
  # TESTING PHASE (user directive 2026-08-04): inbound Entra auth is MASKED, not removed,
  # so nobody needs to log in during the demo/testing phase. AuthMode defaults to 'open',
  # which omits the JWT authorizer on the runtime below. Honesty note: AgentCore has NO
  # unauthenticated mode -- a runtime without an authorizer configuration falls back to
  # the service default, AWS IAM SigV4 ("the default authentication and authorization
  # mechanism that works automatically without additional configuration", AWS devguide
  # bedrock-agentcore/latest/devguide/runtime-oauth.html). So 'open' means "no Entra
  # login; callers sign with AWS credentials", which is as public as the platform allows.
  # Everything Entra stays in this file behind the UseEntra condition. Restore steps:
  # deploy/HANDOFF.md, section "Testing phase: AuthMode=open".
  # ------------------------------------------------------------------------------------

  AuthMode:
    Default: 'open'
    AllowedValues: ['open', 'entra']
    Description: >-
      Inbound auth mode. 'entra' attaches the Microsoft Entra ID JWT authorizer (the
      production path). 'open' masks the Entra authorizer during the testing phase --
      NOT anonymous access: an AgentCore runtime with no authorizer defaults to AWS IAM
      SigV4, so callers sign requests with AWS credentials instead of presenting an
      Entra token. When 'entra', EntraTenantId and EntraClientId must be supplied.
    Type: 'String'

  # The Entra app registration is an Azure resource, so it cannot live in this template
  # and the repo's Terraform-for-Azure stage is deliberately not built. Marty creates the
  # app registration by hand on the Microsoft side; its identifiers reach this stack via
  # SSM parameters, following the SsmCodeStarConnectionArn precedent in
  # pipeline/pipeline.yml (hand-created value, IaC-consumed by name).

  # STASHED (testing phase) -- the original SSM-valued declarations, kept verbatim for a
  # clean restore. They are commented out rather than conditioned because a parameter of
  # Type AWS::SSM::Parameter::Value<String> resolves against SSM at deploy time even when
  # nothing references it: with the /entra/builder-mcp/* parameters absent, every deploy
  # of this template would fail regardless of AuthMode. To restore the SSM-valued form:
  # delete the plain-String pair below, uncomment these (same logical names, so no other
  # edits are needed), and do the HANDOFF pre-flight so the SSM parameters exist.
  #
  # EntraTenantId:
  #   Default: '/entra/builder-mcp/tenant-id'
  #   Description: 'SSM parameter holding the Entra (Azure AD) tenant id of the hand-created app registration; same hand-created-then-referenced pattern as the code-connections ARN.'
  #   Type: 'AWS::SSM::Parameter::Value<String>'
  #
  # EntraClientId:
  #   Default: '/entra/builder-mcp/client-id'
  #   Description: 'SSM parameter holding the application (client) id of the hand-created Entra app registration; same hand-created-then-referenced pattern as the code-connections ARN.'
  #   Type: 'AWS::SSM::Parameter::Value<String>'

  EntraTenantId:
    Default: ''
    AllowedPattern: '.{0,64}'
    Description: >-
      Raw Entra (Azure AD) tenant id of the hand-created app registration. Unused (and
      safely empty) while AuthMode is 'open'; required when AuthMode is 'entra'. Plain
      String during the testing phase so an open-mode deploy has zero SSM pre-flight;
      the SSM-valued form is stashed in the comment above.
    Type: 'String'

  EntraClientId:
    Default: ''
    AllowedPattern: '.{0,64}'
    Description: >-
      Raw application (client) id of the hand-created Entra app registration. Unused
      (and safely empty) while AuthMode is 'open'; required when AuthMode is 'entra'.
      Plain String during the testing phase so an open-mode deploy has zero SSM
      pre-flight; the SSM-valued form is stashed in the comment above.
    Type: 'String'

Conditions:

  # The pipeline's Build stage always supplies an image digest, so the runtime deploys on
  # every pipeline run. The empty-image form exists for hand deploys while debugging.
  HasImage: !Not [!Equals [!Ref 'ContainerImageUri', '']]

  # Testing-phase mask (see the TESTING PHASE banner in Parameters): 'entra' attaches the
  # JWT authorizer to the runtime; 'open' omits it, which on AgentCore means the default
  # inbound auth, AWS IAM SigV4 -- never anonymous.
  UseEntra: !Equals [!Ref 'AuthMode', 'entra']

Resources:

  # Images live in the pipeline's shared ContainerRepository (pipeline/pipeline.yml);
  # this template deliberately owns no registry.

  # Inbound auth (P2, per platform-lead directive 2026-08-03): Microsoft Entra ID
  # client-credentials. The Entra client id/secret pair plays the role of "the builder's
  # API key"; the app registration itself lives on the Azure side (see the Entra*
  # parameters above). This stack contributes only the JWT authorizer configuration.
  # TESTING PHASE: that configuration is currently masked behind AuthMode/UseEntra --
  # see the banner in Parameters and deploy/HANDOFF.md for the restore steps.

  # Execution role: read-mostly by design. The only writes are the two pipeline re-run
  # calls (deployment_restart) and reading the GitHub token secret. Nothing here can
  # create, update, or delete a stack -- that stays with the pipeline's role, on merge.

  BuilderRuntimeRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Application}-${Environment}-builder-mcp-runtime'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - !Sub 'bedrock-agentcore.${AWS::URLSuffix}'
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: 'builder-mcp-runtime'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchCheckLayerAvailability'
                Resource:
                  # The pipeline's shared container repository, named <app>-<env> there.
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Application}-${Environment}'
              # ecr:GetAuthorizationToken is account-level by API design (the token grants
              # registry login, not per-repo access) and cannot be resource-scoped.
              - Effect: 'Allow'
                Action:
                  - 'ecr:GetAuthorizationToken'
                Resource:
                  - '*'
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogGroups'
                  - 'logs:DescribeLogStreams'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*'
              - Effect: 'Allow'
                Action:
                  - 'cloudformation:DescribeStacks'
                  - 'cloudformation:DescribeStackEvents'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${Application}-${Environment}*'
              - Effect: 'Allow'
                Action:
                  - 'codepipeline:GetPipelineState'
                  - 'codepipeline:StartPipelineExecution'
                  - 'codepipeline:RetryStageExecution'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Application}-${Environment}'
                  - !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Application}-${Environment}/*'
              # tag:GetResources supports no resource scoping; the account-wide read IS
              # the feature -- deployment_health's cornell-tag inventory audit needs it.
              - Effect: 'Allow'
                Action:
                  - 'tag:GetResources'
                Resource:
                  - '*'
              - Effect: 'Allow'
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GitHubTokenSecretName}*'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'iam-role-builder-mcp-runtime'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'builder-mcp'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-builder-mcp'

  # The runtime itself (second deploy, once the image exists)

  BuilderRuntime:
    Type: 'AWS::BedrockAgentCore::Runtime'
    Condition: 'HasImage'
    Properties:
      # Runtime names take underscores, not hyphens.
      AgentRuntimeName: !Sub '${Application}_${Environment}_builder_mcp'
      Description: 'Cornell Builder MCP server (Track A) -- searches blueprints, creates deployments, operates them'
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref 'ContainerImageUri'
      RoleArn: !GetAtt 'BuilderRuntimeRole.Arn'
      NetworkConfiguration:
        NetworkMode: 'PUBLIC'
      ProtocolConfiguration: 'MCP'
      # Wrapped in UseEntra (TESTING PHASE): AuthMode=open omits this property entirely,
      # and an AgentCore runtime with no authorizer configuration falls back to AWS IAM
      # SigV4 inbound auth. Masked, not deleted -- the Entra branch below is unchanged.
      AuthorizerConfiguration: !If
        - 'UseEntra'
        - CustomJWTAuthorizer:
            DiscoveryUrl: !Sub 'https://login.microsoftonline.com/${EntraTenantId}/v2.0/.well-known/openid-configuration'
            AllowedClients:
              - !Ref 'EntraClientId'
            # Entra client-credentials tokens carry the Application ID URI as their aud
            # claim; api://<client-id> is the default form Marty configures on the app
            # registration.
            AllowedAudience:
              - !Sub 'api://${EntraClientId}'
        - !Ref 'AWS::NoValue'
      EnvironmentVariables:
        BUILDER_MCP_GITHUB_TOKEN_SECRET: !Ref 'GitHubTokenSecretName'
        BUILDER_MCP_GITHUB_ORG: 'cu-aaii'
        BUILDER_MCP_WORKSHOP_REPO: 'ai-dlc-workshop'
        BUILDER_MCP_APPLICATION: !Ref 'Application'
        BUILDER_MCP_ENVIRONMENT: !Ref 'Environment'
      # AWS::BedrockAgentCore::Runtime takes tags as a map, like AWS::SSM::Parameter.
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'agentcore-runtime-builder-mcp'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'builder-mcp'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-builder-mcp'

Outputs:

  # The Entra outputs exist only when the authorizer does (UseEntra); their absence is
  # how deploy/verify.py auto-detects an open-mode (IAM SigV4) runtime.

  EntraTokenEndpoint:
    Condition: 'UseEntra'
    Description: 'Entra ID OAuth client-credentials token endpoint'
    Value: !Sub 'https://login.microsoftonline.com/${EntraTenantId}/oauth2/v2.0/token'

  EntraClientId:
    Condition: 'UseEntra'
    Description: 'Entra application (client) id; the client secret lives in Secrets Manager, never in this stack'
    Value: !Ref 'EntraClientId'

  RuntimeArn:
    Condition: 'HasImage'
    Description: 'AgentCore runtime ARN; the MCP endpoint URL derives from this (see deploy/verify.py)'
    Value: !GetAtt 'BuilderRuntime.AgentRuntimeArn'
