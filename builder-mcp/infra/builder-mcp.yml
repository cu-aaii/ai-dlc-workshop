AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cornell Builder MCP server on Bedrock AgentCore Runtime: Microsoft Entra ID client-credentials authorizer, execution role, and the runtime itself. Deployed by the pipeline BlueprintDeploy stage; its image is built by the Build stage from the root Dockerfile (target builder-mcp) and pinned by digest.'

Parameters:

  # Metadata Parameters

  Application:
    Default: 'aidlc'
    AllowedPattern: '[a-z0-9-]{1,10}'
    Description: 'Name used for billing and other tracking/identification purposes'
    Type: 'String'

  Environment:
    Default: 'main'
    AllowedPattern: '[a-z0-9]{1,4}'
    Description: 'Name of the deployment branch'
    Type: 'String'

  Owner:
    Default: 'ai-sei'
    AllowedPattern: '.{1,128}'
    Description: 'Who owns this deployment (cornell:owner)'
    Type: 'String'

  BlueprintVersion:
    Default: '0.1.0'
    AllowedPattern: '[0-9]+\.[0-9]+\.[0-9]+'
    Description: 'Version of the builder-mcp component (cornell:blueprint-version)'
    Type: 'String'

  # Deploy Parameters

  ContainerImageUri:
    Default: ''
    AllowedPattern: '.{0,512}'
    Description: 'Image for the runtime, normally the digest URI the pipeline Build stage exports (#{BuilderMcpContainer.CONTAINER_DIGEST}). Empty deploys everything except the runtime, for bootstrap and debugging.'
    Type: 'String'

  GitHubTokenSecretName:
    Default: 'aidlc/main/builder-mcp/github-token'
    AllowedPattern: '.{1,256}'
    Description: 'Secrets Manager secret holding the server-side GitHub token. The secret itself is created by hand and never appears in this repo.'
    Type: 'String'

  # The Entra app registration is an Azure resource, so it cannot live in this template
  # and the repo's Terraform-for-Azure stage is deliberately not built. Marty creates the
  # app registration by hand on the Microsoft side; its identifiers reach this stack via
  # SSM parameters, following the SsmCodeStarConnectionArn precedent in
  # pipeline/pipeline.yml (hand-created value, IaC-consumed by name).

  SsmEntraTenantId:
    Default: '/entra/builder-mcp/tenant-id'
    Description: 'SSM parameter holding the Entra (Azure AD) tenant id of the hand-created app registration; same hand-created-then-referenced pattern as the code-connections ARN.'
    Type: 'AWS::SSM::Parameter::Value<String>'

  SsmEntraClientId:
    Default: '/entra/builder-mcp/client-id'
    Description: 'SSM parameter holding the application (client) id of the hand-created Entra app registration; same hand-created-then-referenced pattern as the code-connections ARN.'
    Type: 'AWS::SSM::Parameter::Value<String>'

Conditions:

  # The pipeline's Build stage always supplies an image digest, so the runtime deploys on
  # every pipeline run. The empty-image form exists for hand deploys while debugging.
  HasImage: !Not [!Equals [!Ref 'ContainerImageUri', '']]

Resources:

  # Images live in the pipeline's shared ContainerRepository (pipeline/pipeline.yml);
  # this template deliberately owns no registry.

  # Inbound auth (P2, per platform-lead directive 2026-08-03): Microsoft Entra ID
  # client-credentials. The Entra client id/secret pair plays the role of "the builder's
  # API key"; the app registration itself lives on the Azure side (see the SsmEntra*
  # parameters above). This stack contributes only the JWT authorizer configuration.

  # Execution role: read-mostly by design. The only writes are the two pipeline re-run
  # calls (deployment_restart) and reading the GitHub token secret. Nothing here can
  # create, update, or delete a stack -- that stays with the pipeline's role, on merge.

  BuilderRuntimeRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Application}-${Environment}-builder-mcp-runtime'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - !Sub 'bedrock-agentcore.${AWS::URLSuffix}'
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: 'builder-mcp-runtime'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchCheckLayerAvailability'
                Resource:
                  # The pipeline's shared container repository, named <app>-<env> there.
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Application}-${Environment}'
              # ecr:GetAuthorizationToken is account-level by API design (the token grants
              # registry login, not per-repo access) and cannot be resource-scoped.
              - Effect: 'Allow'
                Action:
                  - 'ecr:GetAuthorizationToken'
                Resource:
                  - '*'
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogGroups'
                  - 'logs:DescribeLogStreams'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*'
              - Effect: 'Allow'
                Action:
                  - 'cloudformation:DescribeStacks'
                  - 'cloudformation:DescribeStackEvents'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${Application}-${Environment}*'
              - Effect: 'Allow'
                Action:
                  - 'codepipeline:GetPipelineState'
                  - 'codepipeline:StartPipelineExecution'
                  - 'codepipeline:RetryStageExecution'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Application}-${Environment}'
                  - !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Application}-${Environment}/*'
              # tag:GetResources supports no resource scoping; the account-wide read IS
              # the feature -- deployment_health's cornell-tag inventory audit needs it.
              - Effect: 'Allow'
                Action:
                  - 'tag:GetResources'
                Resource:
                  - '*'
              - Effect: 'Allow'
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GitHubTokenSecretName}*'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Environment'
          Value: !Ref 'Environment'
        - Key: 'Resource'
          Value: 'iam-role-builder-mcp-runtime'
        - Key: 'cornell:owner'
          Value: !Ref 'Owner'
        - Key: 'cornell:blueprint'
          Value: 'builder-mcp'
        - Key: 'cornell:blueprint-version'
          Value: !Ref 'BlueprintVersion'
        - Key: 'cornell:deployment-id'
          Value: !Sub '${Application}-${Environment}-builder-mcp'

  # The runtime itself (second deploy, once the image exists)

  BuilderRuntime:
    Type: 'AWS::BedrockAgentCore::Runtime'
    Condition: 'HasImage'
    Properties:
      # Runtime names take underscores, not hyphens.
      AgentRuntimeName: !Sub '${Application}_${Environment}_builder_mcp'
      Description: 'Cornell Builder MCP server (Track A) -- searches blueprints, creates deployments, operates them'
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref 'ContainerImageUri'
      RoleArn: !GetAtt 'BuilderRuntimeRole.Arn'
      NetworkConfiguration:
        NetworkMode: 'PUBLIC'
      ProtocolConfiguration: 'MCP'
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub 'https://login.microsoftonline.com/${SsmEntraTenantId}/v2.0/.well-known/openid-configuration'
          AllowedClients:
            - !Ref 'SsmEntraClientId'
          # Entra client-credentials tokens carry the Application ID URI as their aud
          # claim; api://<client-id> is the default form Marty configures on the app
          # registration.
          AllowedAudience:
            - !Sub 'api://${SsmEntraClientId}'
      EnvironmentVariables:
        BUILDER_MCP_GITHUB_TOKEN_SECRET: !Ref 'GitHubTokenSecretName'
        BUILDER_MCP_GITHUB_ORG: 'cu-aaii'
        BUILDER_MCP_WORKSHOP_REPO: 'ai-dlc-workshop'
        BUILDER_MCP_APPLICATION: !Ref 'Application'
        BUILDER_MCP_ENVIRONMENT: !Ref 'Environment'
      # AWS::BedrockAgentCore::Runtime takes tags as a map, like AWS::SSM::Parameter.
      Tags:
        Application: !Ref 'Application'
        Environment: !Ref 'Environment'
        Resource: 'agentcore-runtime-builder-mcp'
        'cornell:owner': !Ref 'Owner'
        'cornell:blueprint': 'builder-mcp'
        'cornell:blueprint-version': !Ref 'BlueprintVersion'
        'cornell:deployment-id': !Sub '${Application}-${Environment}-builder-mcp'

Outputs:

  EntraTokenEndpoint:
    Description: 'Entra ID OAuth client-credentials token endpoint'
    Value: !Sub 'https://login.microsoftonline.com/${SsmEntraTenantId}/oauth2/v2.0/token'

  EntraClientId:
    Description: 'Entra application (client) id; the client secret lives in Secrets Manager, never in this stack'
    Value: !Ref 'SsmEntraClientId'

  RuntimeArn:
    Condition: 'HasImage'
    Description: 'AgentCore runtime ARN; the MCP endpoint URL derives from this (see deploy/verify.py)'
    Value: !GetAtt 'BuilderRuntime.AgentRuntimeArn'
