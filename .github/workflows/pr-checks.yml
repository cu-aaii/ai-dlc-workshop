name: 'pr-checks'

# Fast, no AWS calls, no credentials -- these have to come back in well under a minute or
# people stop waiting for them. Anything that needs an AWS API call belongs in the pipeline,
# not here.

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: 'pr-checks-${{ github.ref }}'
  cancel-in-progress: true

jobs:

  validate:
    name: 'validate'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:

      # Only github-owned actions and hashicorp/setup-terraform are permitted by the
      # cu-aaii org allowed-actions policy. A third-party action here fails the run before
      # any job logs exist, which reads as a mysterious "startup_failure".
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Python'
        uses: 'actions/setup-python@v5'
        with:
          python-version: '3.12'

      # uv is the only thing installed here -- tools/check fetches pyyaml and cfn-lint itself
      # at the versions pinned in that script. Installed with pip rather than the
      # astral-sh/setup-uv action because the org allowed-actions policy blocks it (see above),
      # which also avoids piping a remote installer into a shell.
      - name: 'Install uv'
        run: 'pip install --disable-pip-version-check uv'

      # The one non-github-owned action the cu-aaii allowed-actions policy permits, which is
      # why Terraform checks can run here at all. terraform_wrapper must be false: the wrapper
      # replaces the binary with a script that captures stdout/stderr, and tools/check parses
      # neither but does rely on real exit codes.
      - name: 'Install Terraform'
        uses: 'hashicorp/setup-terraform@v3'
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false

      # Deliberately the same script contributors run locally, so there is no second code path
      # to drift: green on a laptop means green here.
      - name: 'Run checks'
        run: 'tools/check'
